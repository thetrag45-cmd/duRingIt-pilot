<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>File not found — duRingIt Monie ID</title>
<meta name="description" content="The page you were looking for isn't in the cabinet. Head back to the home page or take the quiz.">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-cream:    #FFF7EA;
  --paper-light: #FFFBF3;
  --paper-warm:  #FAE7C5;
  --ink:         #2A170D;
  --ink-soft:    #4A2E1A;
  --brown:       #6B3F22;
  --brown-soft:  #8A5A33;
  --caramel:     #A66A2E;
  --honey:       #F6B638;
  --honey-light: #FFD56A;
  --honey-deep:  #D89724;
  --sage-deep:   #5E6E3E;
  --border:      #D8B982;
  --border-soft: #E8D4A4;
  --tan:         #C9A36A;
  --shadow:      rgba(91, 55, 20, 0.16);
  --tape:        #F1E2BD;
  --radius-lg: 22px;
  --shadow-paper: 0 1px 0 #fff inset, 0 2px 0 var(--border-soft), 0 14px 24px -10px var(--shadow);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #E8D8B8; }
body {
  font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink); line-height: 1.6; font-size: 16px;
  background:
    repeating-linear-gradient(0deg, rgba(168,130,72,0.05) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(168,130,72,0.05) 0 1px, transparent 1px 28px),
    radial-gradient(120% 60% at 50% 0%, #FFF9EC 0%, var(--bg-cream) 50%, #F0DDB7 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.card {
  position: relative;
  max-width: 540px; width: 100%;
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 48px 36px 36px;
  text-align: center;
  box-shadow: var(--shadow-paper);
}
.card::before {
  content: "";
  position: absolute;
  top: -12px; left: 50%;
  width: 110px; height: 22px;
  background:
    repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,0.04) 6px 7px),
    var(--tape);
  border: 1px solid #D9C28A;
  border-radius: 2px;
  transform: translateX(-50%) rotate(-3deg);
}
.stamp {
  width: 110px; height: 110px;
  margin: 0 auto 18px;
  filter: drop-shadow(0 4px 6px rgba(91,55,20,0.12));
}
.code {
  font-family: 'Caveat', cursive;
  font-size: 26px;
  color: var(--sage-deep);
  margin-bottom: 4px;
  transform: rotate(-1deg);
  display: inline-block;
}
h1 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 42px;
  line-height: 1.0;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin-bottom: 12px;
  text-wrap: balance;
}
p {
  font-size: 15.5px;
  color: var(--ink-soft);
  line-height: 1.55;
  margin-bottom: 24px;
  text-wrap: pretty;
}
.btn-row {
  display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 15px; font-weight: 700;
  padding: 12px 20px; border-radius: 999px;
  text-decoration: none; border: 2px solid;
  transition: transform 0.12s;
}
.btn-primary {
  background: linear-gradient(180deg, var(--honey-light), var(--honey));
  color: var(--ink); border-color: var(--honey-deep);
  box-shadow: 0 3px 0 var(--honey-deep);
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-secondary {
  background: var(--paper-light); color: var(--brown);
  border-color: var(--tan); border-style: dashed;
}
.btn-secondary:hover { color: var(--ink); border-color: var(--brown); }
</style>
</head>
<body>
<div class="card">
  <svg class="stamp" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <g transform="rotate(-8 60 60)">
      <circle cx="60" cy="60" r="50" fill="#FFF9EC" stroke="#A66A2E" stroke-width="3"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="#A66A2E" stroke-width="1.5" stroke-dasharray="2 4"/>
      <text x="60" y="50" font-family="Bricolage Grotesque, sans-serif" font-size="11" font-weight="800" fill="#A66A2E" text-anchor="middle" letter-spacing="2">FILE</text>
      <text x="60" y="68" font-family="Bricolage Grotesque, sans-serif" font-size="22" font-weight="800" fill="#A66A2E" text-anchor="middle">404</text>
      <text x="60" y="86" font-family="Bricolage Grotesque, sans-serif" font-size="11" font-weight="800" fill="#A66A2E" text-anchor="middle" letter-spacing="2">MISSING</text>
    </g>
  </svg>
  <div class="code">file not found ✦</div>
  <h1>This page isn't in the cabinet.</h1>
  <p>We looked everywhere — the folder, the desk, even the bin. The link might be old, or the page may have moved. Head back to start over.</p>
  <div class="btn-row">
    <a class="btn btn-primary" href="./index.html">Go to the home page →</a>
    <a class="btn btn-secondary" href="./duRingIt-pilot-quiz.html">Take the quiz</a>
  </div>
</div>
</body>
</html>
