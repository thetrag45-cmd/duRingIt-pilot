<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>duRingIt — Monie Compatibility</title>
<meta property="og:title" content="Monie Compatibility — duRingIt">
<meta property="og:description" content="See how any two Monie ID archetypes interact — money chemistry, friction, and what you build best together.">
<meta property="og:image" content="./og-cover.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="./og-cover.png">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS — shared with the quiz visual system
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg-cream:    #FFF7EA;
  --paper:       #FFF2D9;
  --paper-light: #FFFBF3;
  --paper-warm:  #FAE7C5;
  --ink:         #2A170D;
  --ink-soft:    #4A2E1A;
  --brown:       #6B3F22;
  --brown-soft:  #8A5A33;
  --caramel:     #A66A2E;
  --honey:       #F6B638;
  --honey-light: #FFD56A;
  --honey-deep:  #D89724;
  --sage:        #7F8F5A;
  --sage-light:  #E6EBD3;
  --sage-deep:   #5E6E3E;
  --border:      #D8B982;
  --border-soft: #E8D4A4;
  --tan:         #C9A36A;
  --shadow:      rgba(91, 55, 20, 0.16);
  --shadow-soft: rgba(91, 55, 20, 0.08);
  --tape:        #F1E2BD;

  /* Compatibility label palettes */
  --es-bg:   #DDEBC8;  --es-bd:  #95B05E;  --es-ink: #4D5F2D;  /* Easy Sync */
  --gb-bg:   #D9E4F2;  --gb-bd:  #93AECF;  --gb-ink: #2F4D74;  /* Good Balance */
  --pt-bg:   #FFE4B8;  --pt-bd:  #E0A347;  --pt-ink: #8C5614;  /* Productive Tension */
  --nc-bg:   #F8D7C2;  --nc-bd:  #DC9F7F;  --nc-ink: #8A4324;  /* Needs Care */
  --hf-bg:   #F1C5C5;  --hf-bd:  #C57878;  --hf-ink: #803333;  /* High Friction */
  --br-bg:   #ECDFEC;  --br-bd:  #C5A8CA;  --br-ink: #6A4275;  /* Bridge */

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 22px;

  --shadow-card: 0 2px 0 var(--border-soft), 0 8px 18px -6px var(--shadow);
  --shadow-paper: 0 1px 0 #fff inset, 0 2px 0 var(--border-soft), 0 14px 24px -10px var(--shadow);
  --shadow-press: 0 2px 6px -2px var(--shadow);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: #E8D8B8; }

body {
  font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.5;
  font-size: 16px;
  background: radial-gradient(circle at 20% 10%, #F0E0BE 0%, #E8D8B8 60%, #DCC89A 100%);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ─── PHONE FRAME (same as quiz) ─── */
.phone {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  background:
    repeating-linear-gradient(0deg, rgba(168,130,72,0.07) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(168,130,72,0.07) 0 1px, transparent 1px 22px),
    radial-gradient(120% 80% at 50% 0%, #FFF9EC 0%, var(--bg-cream) 60%, #F8EAD0 100%);
  overflow: hidden;
}
@media (min-width: 540px) {
  body { padding: 28px 16px; }
  .phone {
    margin: 0 auto;
    min-height: calc(100vh - 56px);
    max-height: 940px;
    border-radius: 44px;
    box-shadow:
      0 0 0 10px #2A170D,
      0 0 0 12px #4A2E1A,
      0 30px 60px -20px rgba(0,0,0,0.45),
      0 50px 100px -30px rgba(0,0,0,0.35);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--tan) transparent;
  }
  .phone::-webkit-scrollbar { width: 6px; }
  .phone::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 3px; }
}

#app { padding: 22px 18px 110px; position: relative; z-index: 1; }

/* ─── TOP BAR ─── */
.topbar {
  display: flex; justify-content: center; align-items: center;
  position: relative; padding: 36px 8px 14px;
  z-index: 2;
}
.brand-pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper-light);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 9px 18px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600; font-size: 14px;
  color: var(--ink);
  box-shadow: var(--shadow-card);
}
.brand-pill .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--brown); flex: 0 0 auto; }
.brand-pill .brand-name { white-space: nowrap; }
.brand-pill .ring { color: var(--honey-deep); font-weight: 700; }

.back-arrow {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(0);
  width: 38px; height: 38px;
  background: var(--paper-light);
  border: 1.5px solid var(--border);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--brown);
  font-size: 18px;
  font-weight: 800;
  box-shadow: var(--shadow-card);
  text-decoration: none;
  font-family: 'Bricolage Grotesque', sans-serif;
  transition: transform 0.12s;
}
.back-arrow:hover { transform: translateY(-2px); }

/* ─── AMBIENT DOODLES (reused) ─── */
.doodle { position: absolute; pointer-events: none; opacity: 0.85; z-index: 0; }
.doodle--clip { top: 6px; left: 8px; transform: rotate(-18deg); width: 44px; }
.doodle--stamp { top: 14px; right: 12px; width: 70px; opacity: 0.75; }
.doodle--coins { bottom: 100px; right: -8px; width: 86px; opacity: 0.7; }
.doodle--receipt { bottom: 80px; left: -8px; width: 60px; opacity: 0.65; transform: rotate(-6deg); }
.doodle--leaf { bottom: 20px; left: 10px; width: 40px; opacity: 0.7; }
.doodle svg { display: block; width: 100%; }

/* ─── PAGE TITLE ─── */
.page-eyebrow {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brown-soft);
  text-align: center;
  margin-bottom: 6px;
  position: relative; z-index: 2;
}
.page-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 36px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-align: center;
  margin-bottom: 10px;
  text-wrap: balance;
  position: relative; z-index: 2;
}
.page-sub {
  font-size: 14.5px;
  color: var(--ink-soft);
  line-height: 1.55;
  text-align: center;
  margin: 0 auto 22px;
  max-width: 360px;
  position: relative; z-index: 2;
}

/* ─── BEGA CARD THUMBNAIL ─── */
.card-thumb {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #FFF6E6;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-card);
  aspect-ratio: 948 / 1659;
}
.card-thumb img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
}
/* "YOU" pinned tab */
.card-thumb.you::before {
  content: "YOU";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--sage);
  color: #fff;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 10px;
  letter-spacing: 0.18em;
  padding: 4px 14px;
  border-radius: 0 0 6px 6px;
  border: 1.5px solid var(--sage-deep);
  z-index: 2;
  box-shadow: 0 2px 4px var(--shadow-soft);
}
.card-thumb.them::before {
  content: "THEM";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--caramel);
  color: #fff;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 10px;
  letter-spacing: 0.18em;
  padding: 4px 14px;
  border-radius: 0 0 6px 6px;
  border: 1.5px solid #7A4B1C;
  z-index: 2;
  box-shadow: 0 2px 4px var(--shadow-soft);
}

/* placeholder face when image missing */
.card-ph {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(45deg, rgba(168,130,72,0.06) 0 2px, transparent 2px 14px),
    radial-gradient(circle at 30% 20%, #FFF6DC 0%, var(--paper-warm) 50%, #E8C879 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  text-align: center;
}
.card-ph .code {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 48px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1;
  text-shadow: 2px 2px 0 #FFE7A4;
}
.card-ph .ph-fam {
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--brown); margin-bottom: 4px;
}
.card-ph .ph-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 13px;
  line-height: 1.1; margin-top: 6px;
  color: var(--ink); text-wrap: balance;
}

/* ─── PAIR HEADER (You × Them) ─── */
.pair-row {
  display: grid;
  grid-template-columns: 1fr 60px 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 18px;
  position: relative; z-index: 2;
}
.pair-row .card-thumb { margin-top: 12px; }
.pair-connector {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
}
.pair-stamp {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid var(--caramel);
  display: flex; align-items: center; justify-content: center;
  color: var(--caramel);
  background: rgba(255,255,255,0.5);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 22px;
  transform: rotate(-6deg);
  position: relative;
}
.pair-stamp::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1.5px dashed var(--caramel);
  opacity: 0.5;
}

/* ─── COMPAT LABEL PILL ─── */
.compat-label {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1.5px solid;
}
.compat-label--es { background: var(--es-bg); border-color: var(--es-bd); color: var(--es-ink); }
.compat-label--gb { background: var(--gb-bg); border-color: var(--gb-bd); color: var(--gb-ink); }
.compat-label--pt { background: var(--pt-bg); border-color: var(--pt-bd); color: var(--pt-ink); }
.compat-label--nc { background: var(--nc-bg); border-color: var(--nc-bd); color: var(--nc-ink); }
.compat-label--hf { background: var(--hf-bg); border-color: var(--hf-bd); color: var(--hf-ink); }
.compat-label--br { background: var(--br-bg); border-color: var(--br-bd); color: var(--br-ink); }

/* ─── VERDICT BLOCK ─── */
.verdict {
  text-align: center;
  margin: 6px 0 18px;
  position: relative; z-index: 2;
}
.verdict-eyebrow {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brown-soft);
  margin-bottom: 8px;
}
.verdict-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 32px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 12px;
  text-wrap: balance;
}
.verdict-sub {
  font-size: 14.5px;
  color: var(--ink-soft);
  line-height: 1.55;
  max-width: 380px;
  margin: 0 auto;
  text-wrap: pretty;
}

/* ─── METERS BLOCK ─── */
.meters-card {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-card);
  position: relative; z-index: 2;
}
.meter-row {
  display: grid;
  grid-template-columns: 28px 92px 1fr 72px;
  gap: 8px;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px dashed #E0CA8E;
}
.meter-row:last-child { border-bottom: none; }
.meter-icon {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
}
.meter-icon svg { width: 22px; height: 22px; }
.meter-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600;
  font-size: 13px;
  color: var(--ink-soft);
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.meter-bar {
  position: relative;
  height: 14px;
  border-radius: 7px;
  background: linear-gradient(90deg, #D7E1B7 0%, #F5C842 50%, #E89A7F 100%);
  border: 1px solid var(--border-soft);
  overflow: visible;
}
.meter-arrow {
  position: absolute;
  top: -2px;
  width: 0; height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 8px solid var(--ink);
  transform: translateX(-50%);
}
.meter-arrow::after {
  content: "";
  position: absolute;
  top: 8px;
  left: -6px;
  width: 12px; height: 14px;
  border-radius: 0 0 6px 6px;
  background: var(--honey);
  border: 1.5px solid var(--honey-deep);
  border-top: none;
}
.meter-value {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--brown);
  text-align: right;
  line-height: 1.1;
}

/* ─── SECTION CARDS (paper notes) ─── */
.section-card {
  position: relative;
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 18px 18px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-card);
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 14px;
  align-items: start;
  z-index: 2;
}
.section-card::after {
  content: "";
  position: absolute;
  bottom: -1px; right: -1px;
  width: 22px; height: 22px;
  background: linear-gradient(135deg, transparent 50%, var(--border-soft) 50%, var(--border-soft) 56%, var(--paper-warm) 56%);
  border-bottom-right-radius: var(--radius-lg);
}
.sc-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.sc-icon svg { width: 26px; height: 26px; }
.sc-icon.chem    { background: #F8D7C2; border: 1.5px solid #DC9F7F; color: #8A4324; }
.sc-icon.fric    { background: #FFE4B8; border: 1.5px solid var(--honey-deep); color: #8C5614; }
.sc-icon.best    { background: var(--sage-light); border: 1.5px solid #B7C28A; color: var(--sage-deep); }
.sc-icon.watch   { background: var(--paper-warm); border: 1.5px solid var(--tan); color: var(--brown); }

.sc-body {
  display: flex; flex-direction: column; gap: 6px;
}
.sc-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.sc-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  line-height: 1.15;
}
.sc-stamp {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1.5px dashed;
  white-space: nowrap;
  transform: rotate(-3deg);
}
.sc-stamp.chem  { color: #8A4324; border-color: #DC9F7F; background: #FFF1E8; }
.sc-stamp.fric  { color: var(--honey-deep); border-color: var(--honey-deep); background: #FFF6DC; }
.sc-stamp.best  { color: var(--sage-deep); border-color: #B7C28A; background: #F3F7DF; }
.sc-stamp.watch { color: var(--brown); border-color: var(--tan); background: var(--paper-warm); }
.sc-text {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.55;
}
.sc-list {
  list-style: none; padding: 0; margin: 4px 0 0;
}
.sc-list li {
  position: relative;
  padding: 6px 0 6px 18px;
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.5;
}
.sc-list li::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 12px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.5;
}

/* ─── BUTTONS ─── */
.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
  position: relative; z-index: 2;
}
.btn-row.single { grid-template-columns: 1fr; }

.btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  gap: 8px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 15px;
  font-weight: 700;
  padding: 14px 18px;
  border-radius: 999px;
  cursor: pointer;
  text-decoration: none;
  border: 2px solid;
  transition: transform 0.12s, box-shadow 0.12s;
  letter-spacing: 0.01em;
  text-align: center;
}
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn-primary {
  background: linear-gradient(180deg, var(--honey-light), var(--honey));
  color: var(--ink);
  border-color: var(--honey-deep);
  box-shadow: 0 3px 0 var(--honey-deep), 0 10px 18px -6px var(--shadow);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--honey-deep), 0 14px 22px -6px var(--shadow); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--honey-deep); }

.btn-secondary {
  background: var(--paper-light);
  color: var(--brown);
  border-color: var(--tan);
  border-style: dashed;
  box-shadow: var(--shadow-card);
}
.btn-secondary:hover { border-color: var(--brown); color: var(--ink); }

/* ─── PICKER GRID ─── */
.picker-eyebrow {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brown-soft);
  text-align: center;
  margin: 14px 0 12px;
  position: relative; z-index: 2;
}
.picker-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 12px;
  position: relative; z-index: 2;
}
.pick-card {
  position: relative;
  padding: 6px 6px 10px;
  border-radius: var(--radius-md);
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  cursor: pointer;
  text-align: center;
  box-shadow: var(--shadow-card);
  transition: transform 0.12s, border-color 0.12s, background 0.12s, box-shadow 0.12s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pick-card:hover {
  transform: translateY(-2px);
  border-color: var(--honey);
}
.pick-card .card-thumb {
  border: none;
  box-shadow: none;
  background: #FFF6E6;
}
.pick-meta {
  padding: 0 4px;
}
.pick-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
  line-height: 1.15;
  text-wrap: balance;
}
.pick-code {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--brown-soft);
  margin-top: 4px;
}

/* User card hero (top of picker) */
.you-hero {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 14px;
  align-items: center;
  margin-bottom: 16px;
  box-shadow: var(--shadow-paper);
  position: relative; z-index: 2;
}
.you-hero .card-thumb { width: 96px; }

/* ═══════════════════════════════════════════════════════════
   LABEL DERIVATION — score → label
   Per spec: Easy Sync, Good Balance, Productive Tension,
             Needs Care, High Friction
   ═══════════════════════════════════════════════════════════ */
function labelFor(score) {
  if (score >= 75) return { code: 'es', name: 'Easy Sync',          tagline: 'Aligned values, low friction.' };
  if (score >= 60) return { code: 'gb', name: 'Good Balance',       tagline: 'Different strengths, same direction.' };
  if (score >= 50) return { code: 'pt', name: 'Productive Tension', tagline: 'Healthy push and pull.' };
  if (score >= 40) return { code: 'nc', name: 'Needs Care',         tagline: 'Manageable, with intention.' };
  return                   { code: 'hf', name: 'High Friction',     tagline: 'Real work required.' };
}

/* ═══════════════════════════════════════════════════════════
   METER LABEL TEXT — translate -2..+2 to friendly labels
   ═══════════════════════════════════════════════════════════ */
function meterLabel(axis, v) {
  // v is in -2..+2 (avg of two profiles). Map to 0..1 for arrow position.
  var pct = (v + 2) / 4;
  var text = '';
  if (axis === 'sync') {
    if (v >= 1.2) text = 'High';
    else if (v >= 0.4) text = 'Steady';
    else if (v >= -0.4) text = 'Mixed';
    else if (v >= -1.2) text = 'Variable';
    else text = 'Low';
  } else if (axis === 'rhythm') {
    if (v >= 1.2) text = 'Planned';
    else if (v >= 0.4) text = 'Mostly planned';
    else if (v >= -0.4) text = 'Balanced';
    else if (v >= -1.2) text = 'Mostly free';
    else text = 'Spontaneous';
  } else if (axis === 'plan') {
    if (v >= 1.2) text = 'Long-term';
    else if (v >= 0.4) text = 'Future-focused';
    else if (v >= -0.4) text = 'Balanced';
    else if (v >= -1.2) text = 'Present-focused';
    else text = 'In the moment';
  } else if (axis === 'stress') {
    if (v >= 1.2) text = 'Analyse';
    else if (v >= 0.4) text = 'Tackle';
    else if (v >= -0.4) text = 'Mixed';
    else if (v >= -1.2) text = 'Pause';
    else text = 'Avoid';
  }
  return { pct: pct, text: text };
}

/* ═══════════════════════════════════════════════════════════
   ROUTER
   ?a=X            → picker (single archetype, choose to compare)
   ?a=X&compare=Y  → pair result (X vs Y)
   ?a=X&b=Y        → bridge result (user is bridge of X+Y)
   ═══════════════════════════════════════════════════════════ */
function getParams() {
  var p = new URLSearchParams(window.location.search);
  function safe(v) { return (v && NAMES[v]) ? v : null; }
  return { a: safe(p.get('a')), b: safe(p.get('b')), compare: safe(p.get('compare')), from: safe(p.get('from')) };
}

function render() {
  var app = document.getElementById('app');
  var p = getParams();
  var view = new URLSearchParams(window.location.search).get('view');

  if (view === 'map' && p.a && NAMES[p.a]) {
    app.innerHTML = renderMap(p.a, p.from);
  } else if (p.a && p.b && p.a !== p.b) {
    app.innerHTML = renderBridge(p.a, p.b);
  } else if (p.a && p.compare && p.a !== p.compare) {
    app.innerHTML = renderPair(p.a, p.compare, p.from);
  } else if (p.a && NAMES[p.a]) {
    app.innerHTML = renderPicker(p.a, p.from);
  } else {
    app.innerHTML = renderEmpty();
  }
  scrollTo(0, 0);
}

/* ═══════════════════════════════════════════════════════════
   COMPATIBILITY MAP — groups all other 10 archetypes around the user
   by compatibility label derived from existing pair scores.
   ═══════════════════════════════════════════════════════════ */
function renderMap(a, bridgePartner) {
  var hasBridge = bridgePartner && NAMES[bridgePartner] && bridgePartner !== a;
  /* Bucket every other type into one of the 5 labels */
  var buckets = { es: [], gb: [], pt: [], nc: [], hf: [] };
  ORDER.forEach(function(c){
    if (c === a) return;
    var pair = COMPAT[key(a, c)];
    if (!pair) return;
    var label = labelFor(pair.score);
    buckets[label.code].push({ code: c, score: pair.score, verdict: pair.verdict });
  });
  /* Sort each bucket by score, high → low */
  Object.keys(buckets).forEach(function(k){ buckets[k].sort(function(x, y){ return y.score - x.score; }); });

  function bucketHtml(code, name, tagline, items) {
    if (!items.length) return '';
    var cards = items.map(function(it){
      var clickFn = hasBridge
        ? "goComparePicker('" + a + "','" + it.code + "','" + bridgePartner + "')"
        : "goCompare('" + a + "','" + it.code + "')";
      return '<button class="map-card" onclick="' + clickFn + '" aria-label="Compare with ' + escHtml(NAMES[it.code]) + '">' +
        cardThumb(it.code) +
        '<div class="map-card-meta">' +
          '<div class="map-card-name">' + escHtml(NAMES[it.code]) + '</div>' +
          '<div class="map-card-code">' + escHtml(TYPE_CODES[it.code]) + '</div>' +
        '</div>' +
      '</button>';
    }).join('');
    return '<div class="map-bucket map-bucket--' + code + '">' +
      '<div class="map-bucket-header">' +
        '<span class="compat-label compat-label--' + code + '">' + escHtml(name) + '</span>' +
        '<span class="map-bucket-tag">' + escHtml(tagline) + '</span>' +
      '</div>' +
      '<div class="map-cards-row">' + cards + '</div>' +
    '</div>';
  }

  var backCall = hasBridge
    ? "backToMyResult('" + a + "','" + bridgePartner + "')"
    : "backToMyResult('" + a + "')";
  var pickerCall = hasBridge
    ? "goPicker('" + a + "','" + bridgePartner + "')"
    : "goPicker('" + a + "')";

  return topbarChrome(backCall) +
    ambient('a') +
    '<div class="page-eyebrow">Your Compatibility Map</div>' +
    '<div class="page-title">Where you sync<br>and where you clash</div>' +
    '<div class="page-sub">See how your Monie ID lines up with all 10 other archetypes. Tap any card for the full pair read.</div>' +

    '<div class="map-center">' +
      cardThumb(a, 'you') +
      '<div class="map-center-name">' + escHtml(NAMES[a]) + '</div>' +
      '<div class="map-center-code">' + escHtml(TYPE_CODES[a]) + '</div>' +
    '</div>' +
    idSwitchRow(a, bridgePartner) +

    bucketHtml('es', 'Easy Sync',          'Aligned values, low friction.',          buckets.es) +
    bucketHtml('gb', 'Good Balance',       'Different strengths, same direction.',   buckets.gb) +
    bucketHtml('pt', 'Productive Tension', 'Healthy push and pull.',                  buckets.pt) +
    bucketHtml('nc', 'Needs Care',         'Manageable, with intention.',             buckets.nc) +
    bucketHtml('hf', 'High Friction',      'Real work required.',                     buckets.hf) +

    '<div class="btn-row">' +
      '<button class="btn btn-secondary" onclick="' + pickerCall + '">View as picker</button>' +
      '<button class="btn btn-primary" onclick="' + backCall + '">← Back to my result</button>' +
    '</div>';
}

/* ═══════════════════════════════════════════════════════════
   COMMON CHROME
   ═══════════════════════════════════════════════════════════ */
function topbarChrome(backHref) {
  var back = backHref

      '<span class="brand-name">du<span class="ring">Ring</span>It</span>' +
      '<span class="dot"></span>' +
      '<span>Monie Compatibility</span>' +

/* ═══════════════════════════════════════════════════════════
   SCREEN 2: PAIR RESULT
   ═══════════════════════════════════════════════════════════ */
function renderPair(a, b, bridgePartner) {
  var hasBridge = bridgePartner && NAMES[bridgePartner] && bridgePartner !== a && bridgePartner !== b;
  var pair = COMPAT[key(a, b)];
  if (!pair) {
    return topbarChrome("goPicker('" + a + "'" + (hasBridge ? ",'" + bridgePartner + "'" : '') + ")") +
      '<div class="page-title" style="margin-top:24px">Pair not found</div>' +
      '<div class="page-sub">We couldn\'t find compatibility data for this combination.</div>';
  }
  var label = labelFor(pair.score);

  // meters (mid-point between two profiles)
  var pa = PROFILE[a], pb = PROFILE[b];
  var rhythmAvg = (pa.rhythm + pb.rhythm) / 2;
  var planAvg   = (pa.plan + pb.plan) / 2;
  var stressAvg = (pa.stress + pb.stress) / 2;
  // sync from pair score, mapped to -2..+2
  var syncAvg = (pair.score - 50) / 12.5; // 50→0, 100→4 clamp
  if (syncAvg > 2) syncAvg = 2;
  if (syncAvg < -2) syncAvg = -2;

  var sync   = meterLabel('sync', syncAvg);
  var rhythm = meterLabel('rhythm', rhythmAvg);
  var planM  = meterLabel('plan', planAvg);
  var stress = meterLabel('stress', stressAvg);

  // map strengths/tensions → 4 sections
  var moneyChemBody = pair.summary;
  var fricBody  = (pair.tensions[0] || 'A pairing without natural tension can also have natural drift.');
  var fricExtra = pair.tensions.slice(1, 3);
  var bestBody  = (pair.strengths[0] || 'Find a shared rhythm and let each lead in their domain.');
  var bestExtra = pair.strengths.slice(1, 3);
  var watchBody = pair.tensions.length > 1
    ? pair.tensions[pair.tensions.length - 1]
    : 'Check in regularly so neither of you ends up carrying the financial weight alone.';

  var pickerCall = hasBridge
    ? "goPicker('" + a + "','" + bridgePartner + "')"
    : "goPicker('" + a + "')";
  var backCall = hasBridge
    ? "backToMyResult('" + a + "','" + bridgePartner + "')"
    : "backToMyResult('" + a + "')";

  return topbarChrome(backCall) +
    ambient('a') +
    '<div class="page-eyebrow">Compatibility Read' + (hasBridge ? ' · Your ' + escHtml(a) + ' side' : '') + '</div>' +
    '<div class="pair-row">' +
      cardThumb(a, 'you') +
      '<div class="pair-connector">' +
        '<div class="pair-stamp">×</div>' +
      '</div>' +
      cardThumb(b, 'them') +
    '</div>' +
    idSwitchRow(a, bridgePartner) +

    '<div class="verdict">' +
      '<div class="verdict-eyebrow"><span class="compat-label compat-label--' + label.code + '">' + label.name + '</span></div>' +
      '<div class="verdict-title">' + escHtml(pair.verdict) + '</div>' +
      '<div class="verdict-sub">' + escHtml(label.tagline) + '</div>' +
    '</div>' +

    /* — METERS — */
    '<div class="meters-card">' +
      meterRow(coinIcon(),     'Money Sync',      sync.pct,   sync.text) +
      meterRow(heartIcon(),    'Spending Rhythm', rhythm.pct, rhythm.text) +
      meterRow(clipIcon(),     'Planning Style',  planM.pct,  planM.text) +
      meterRow(boltIcon(),     'Stress Response', stress.pct, stress.text) +
    '</div>' +

    /* — SECTIONS — */
    sectionCard('chem',  heartLgIcon(),  'Money Chemistry',   'GOOD CHEMISTRY',  moneyChemBody,  []) +
    sectionCard('fric',  boltLgIcon(),   'Friction Point',    'HANDLE WITH CARE', fricBody,      fricExtra) +
    sectionCard('best',  leafLgIcon(),   'Best Together For', 'STRONG MATCH',    bestBody,       bestExtra) +
    sectionCard('watch', shieldLgIcon(), 'Watch Out For',     'CHECK ALIGNMENT', watchBody,      []) +

    '<div class="btn-row">' +
      '<button class="btn btn-secondary" onclick="' + pickerCall + '">← Compare another</button>' +
      '<button class="btn btn-primary" onclick="sharePair(\'' + a + '\',\'' + b + '\',false)">Share pairing</button>' +
    '</div>' +
    '<div class="btn-row single">' +
      '<button class="btn btn-secondary" onclick="' + backCall + '">← Back to my result</button>' +
    '</div>';
}

   NAVIGATION + SHARE

/* ─── Switch-my-Monie-ID controls ─── */
function getTestedMonieId() {
  try { return localStorage.getItem('monieId') || null; } catch (e) { return null; }
}
function getTestedBridgePartner() {
  try { return localStorage.getItem('monieBridge') || null; } catch (e) { return null; }
}
function idSwitchRow(currentA, bridgePartner) {
  var tested = getTestedMonieId();
  var testedBridge = getTestedBridgePartner();
  var testedKnown = tested && NAMES[tested];
  var isOnTested = testedKnown && tested === currentA &&
    ((bridgePartner || '') === (testedBridge || ''));
  var testedLabel = testedKnown
    ? 'Use my tested ID' + (testedBridge && NAMES[testedBridge] ? ' (Bridge)' : '')
    : 'No tested ID yet';
  var testedTitle = testedKnown
    ? 'Switch back to ' + NAMES[tested] + (testedBridge && NAMES[testedBridge] ? ' \u00d7 ' + NAMES[testedBridge] : '')
    : 'Take the quiz first to save your tested Monie ID.';
  return '<div class="id-switch-row">' +
    '<button class="id-switch-btn" type="button" onclick="openIdSwitcher()" aria-haspopup="dialog">' +
      '<span class="icon">\u21c4</span> Switch my Monie ID' +
    '</button>' +
    '<button class="id-switch-btn id-switch-tested" type="button" ' +
      (testedKnown && !isOnTested ? '' : 'disabled ') +
      'onclick="revertToTestedId()" title="' + escHtml(testedTitle) + '">' +
      '<span class="icon">\u21bb</span> ' + escHtml(isOnTested ? "You're on your tested ID" : testedLabel) +
    '</button>' +
  '</div>';
}

function revertToTestedId() {
  var tested = getTestedMonieId();
  if (!tested || !NAMES[tested]) return;
  var bridge = getTestedBridgePartner();
  var url = COMPAT_URL + '?a=' + tested;
  if (bridge && NAMES[bridge] && bridge !== tested) url += '&b=' + bridge;
  window.location.href = url;
}

function getCurrentParams() {
  var p = new URLSearchParams(window.location.search);
  return { a: p.get('a'), b: p.get('b'), compare: p.get('compare'), from: p.get('from') };
}

function openIdSwitcher() {
  var p = getCurrentParams();
  var currentA = p.a;
  var tested = getTestedMonieId();
  var cards = ORDER.map(function(c) {
    var badges = [];
    if (c === currentA) badges.push('<span class="id-modal-card-badge current">Current</span>');
    if (c === tested)   badges.push('<span class="id-modal-card-badge tested">My tested</span>');
    var cls = 'id-modal-card' +
      (c === currentA ? ' is-current' : '') +
      (c === tested && c !== currentA ? ' is-tested' : '');
    return '<button class="' + cls + '" type="button" onclick="pickNewMonieId(\'' + c + '\')" aria-label="Set ' + escHtml(NAMES[c]) + ' as my Monie ID">' +
      cardThumb(c) +
      '<div class="id-modal-card-meta">' +
        '<div class="id-modal-card-name">' + escHtml(NAMES[c]) + '</div>' +
        '<div class="id-modal-card-code">' + escHtml(TYPE_CODES[c]) + '</div>' +
        (badges.length ? '<div class="id-modal-card-badges">' + badges.join('') + '</div>' : '') +
      '</div>' +
    '</button>';
  }).join('');

  var testedNote = tested && NAMES[tested]
    ? 'Your quiz-tested ID is <strong>' + escHtml(NAMES[tested]) + '</strong>. Pick any card below to view compatibility from a different perspective.'
    : "You haven't taken the quiz yet \u2014 pick any card to explore compatibility, or take the quiz to lock in your real Monie ID.";

  var modal = document.getElementById('idSwitchModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'idSwitchModal';
    modal.className = 'id-modal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', 'idSwitchTitle');
    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeIdSwitcher();
    });
  }
  modal.innerHTML =
    '<div class="id-modal-inner">' +
      '<div class="id-modal-head">' +
        '<div class="id-modal-title-wrap">' +
          '<div class="id-modal-eyebrow">switch perspective \u2192</div>' +
          '<div class="id-modal-title" id="idSwitchTitle">Set your Monie ID</div>' +
          '<div class="id-modal-sub">' + testedNote + '</div>' +
        '</div>' +
        '<button class="id-modal-close" type="button" onclick="closeIdSwitcher()" aria-label="Close">\u00d7</button>' +
      '</div>' +
      '<div class="id-modal-grid">' + cards + '</div>' +
    '</div>';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeIdSwitcher() {
  var modal = document.getElementById('idSwitchModal');
  if (modal) modal.classList.remove('open');
  document.body.style.overflow = '';
}

function pickNewMonieId(newA) {
  if (!NAMES[newA]) return;
  closeIdSwitcher();
  var p = getCurrentParams();
  var url = COMPAT_URL + '?a=' + newA;
  if (p.compare && p.compare !== newA && NAMES[p.compare]) {
    url += '&compare=' + p.compare;
  }
  window.location.href = url;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeIdSwitcher();
});

function goPicker(a, bridgePartner) {
  var url = COMPAT_URL + '?a=' + a;
  if (bridgePartner) url += '&from=' + bridgePartner;
  window.location.href = url;
}
function goCompare(a, b) {
  window.location.href = COMPAT_URL + '?a=' + a + '&compare=' + b;
}
/* Compare from a bridge user's picker. Preserves bridge partner in URL
   so back navigation can restore the bridge result page. */
function goComparePicker(a, b, bridgePartner) {
  window.location.href = COMPAT_URL + '?a=' + a + '&compare=' + b + '&from=' + bridgePartner;
}

/* Smart back navigation:
   - If there's a real history entry to go back to (came from landing, archetype, quiz, etc.),
     use history.back() — this naturally restores whatever page they were on, including a real
     quiz result via the quiz's own sessionStorage restore.
   - If they arrived directly (e.g. shared link, fresh tab with no history), fall back to landing.
   The `a`/`b` parameters are kept for callsite compatibility but no longer seed fake state. */
function backToMyResult(a, b) {
  if (window.history.length > 1 && document.referrer && document.referrer !== window.location.href) {
    window.history.back();
  } else {
    window.location.href = './index.html';
  }
}
function sharePair(a, b, isBridge) {
  var text;
  if (isBridge) {
    text = "On the duRingIt Monie ID quiz, I'm a Bridge between " + NAMES[a] + " and " + NAMES[b] + " 🔀\n\nWhat's your money type?\n\n" + COMPAT_URL + "?a=" + a + "&b=" + b;
  } else {
    var label = labelFor(COMPAT[key(a,b)].score).name;
    text = NAMES[a] + " × " + NAMES[b] + ": " + label + " on the duRingIt Monie Compatibility map 💡\n\nFind out yours: " + COMPAT_URL + "?a=" + a + "&compare=" + b;
  }
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

/* ═══════════════════════════════════════════════════════════
   UTILS
   ═══════════════════════════════════════════════════════════ */
function escHtml(s) {
  if (s === undefined || s === null) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

render();
</script>
</body>
</html>
