var ORDER = ["WA","AB","ST","FC","LR","LI","SS","SG","AX","EE","WN"];

function populate() {
  var sA = document.getElementById("selA");
  var sB = document.getElementById("selB");
  ORDER.forEach(function(code) {
    var opt1 = document.createElement("option");
    opt1.value = code;
    opt1.textContent = NAMES[code] + " (" + CAT[code] + ")";
    var opt2 = document.createElement("option");
    opt2.value = code;
    opt2.textContent = NAMES[code] + " (" + CAT[code] + ")";
    sA.appendChild(opt1);
    sB.appendChild(opt2);
  });
  // Read URL params
  var params = new URLSearchParams(window.location.search);
  var pa = params.get("a"), pb = params.get("b");
  if (pa && NAMES[pa]) sA.value = pa;
  if (pb && NAMES[pb]) sB.value = pb;
  else {
    // Default B to something different from A
    var codes = ORDER.filter(function(c){ return c !== (pa || ORDER[0]); });
    sB.value = codes[0];
  }
  if (pa) checkCompat();
}

function meterColor(score) {
  if (score >= 75) return "#4CAF50";
  if (score >= 60) return "#F5C842";
  if (score >= 45) return "#FF9800";
  return "#F44336";
}

function verdictEmoji(score) {
  if (score >= 80) return "🔥";
  if (score >= 65) return "⚡";
  if (score >= 50) return "⚖️";
  if (score >= 38) return "⚠️";
  return "💥";
}

function checkCompat() {
  var a = document.getElementById("selA").value;
  var b = document.getElementById("selB").value;
  var k = key(a, b);
  var c = COMPAT[k];
  var out = document.getElementById("result");

  if (a === b) {
    out.innerHTML = '<div class="same-card">'+
      '<div class="same-emoji">🪞</div>'+
      '<div class="same-title">Same type — mirror match</div>'+
      '<div class="same-body">Two '+NAMES[a]+'s together. You\'ll understand each other intuitively — but you\'ll also share the same blind spots. Your strengths will compound. So will your weaknesses.</div>'+
      shareSection(a, a)+
    '</div>';
    return;
  }

  if (!c) {
    out.innerHTML = '<div class="result-card"><p style="color:#666">Compatibility data for this pair is coming soon.</p></div>';
    return;
  }

  var fillColor = meterColor(c.score);
  var emoji = verdictEmoji(c.score);

  var strengthsHtml = c.strengths.map(function(s){ return '<div class="strength-item">✓ '+s+'</div>'; }).join('');
  var tensionsHtml = c.tensions.map(function(t){ return '<div class="tension-item">↯ '+t+'</div>'; }).join('');

  out.innerHTML = '<div class="result-card">'+
    '<div class="compat-pair">'+
      '<div>'+
        '<div class="compat-blob" style="background:'+COLORS[a]+'">'+NAMES[a].charAt(0)+'</div>'+
        '<div class="compat-name">'+NAMES[a]+'</div>'+
        '<div class="compat-cat">'+CAT[a]+'</div>'+
      '</div>'+
      '<div class="compat-x">×</div>'+
      '<div>'+
        '<div class="compat-blob" style="background:'+COLORS[b]+'">'+NAMES[b].charAt(0)+'</div>'+
        '<div class="compat-name">'+NAMES[b]+'</div>'+
        '<div class="compat-cat">'+CAT[b]+'</div>'+
      '</div>'+
    '</div>'+

    '<div class="score-label">Compatibility score</div>'+
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">'+
      '<div class="compat-meter-wrap">'+
        '<div class="compat-meter-bg"><div class="compat-meter-fill" style="width:'+c.score+'%;background:'+fillColor+'"></div></div>'+
      '</div>'+
      '<div class="compat-score-num">'+c.score+'</div>'+
    '</div>'+

    '<div class="compat-verdict">'+emoji+' '+c.verdict+'</div>'+
    '<div class="compat-summary">'+c.summary+'</div>'+

    (strengthsHtml ? '<div class="tension-section"><div class="tension-label">What works</div>'+strengthsHtml+'</div>' : '')+
    (tensionsHtml ? '<div class="tension-section"><div class="tension-label">Where it gets hard</div>'+tensionsHtml+'</div>' : '')+
    shareSection(a, b)+
  '</div>';

  // Update URL without reload
  var newUrl = COMPAT_URL + '?a=' + a + '&b=' + b;
  window.history.replaceState({}, '', window.location.pathname + '?a='+a+'&b='+b);
}

function shareSection(a, b) {
  var text = "I checked the duRingIt Monie Compatibility between "+NAMES[a]+" and "+NAMES[b]+" 👀\n\nCheck yours: "+COMPAT_URL+"?a="+a+"&b="+b;
  var waHref = "https://wa.me/?text="+encodeURIComponent(text);
  return '<button class="btn-whatsapp" onclick="window.open(\''+waHref+'\',\'_blank\')">💬 Share this result on WhatsApp</button>'+
    '<a class="btn-retake" href="'+QUIZ_URL+'">Don\'t know your type? Take the quiz →</a>';
}
