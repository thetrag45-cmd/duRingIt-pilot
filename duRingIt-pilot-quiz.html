<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>duRingIt — Monie ID (Pilot)</title>
<meta property="og:title" content="duRingIt — Monie ID Intake">
<meta property="og:description" content="Discover which of 11 financial archetypes you are. 16 questions, ~4 minutes.">
<meta property="og:image" content="./og-cover.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="./og-cover.png">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ───────────────────────────────────────────────────────────
   DESIGN TOKENS — Monie ID Intake / Paper Folder visual system
   ─────────────────────────────────────────────────────────── */
:root {
  --bg-cream:    #FFF7EA;
  --paper:       #FFF2D9;
  --paper-light: #FFFBF3;
  --paper-warm:  #FAE7C5;
  --ink:         #2A170D;
  --ink-soft:    #4A2E1A;
  --brown:       #6B3F22;
  --brown-soft:  #8A5A33;
  --caramel:     #A66A2E;
  --honey:       #F6B638;
  --honey-light: #FFD56A;
  --honey-deep:  #D89724;
  --sage:        #7F8F5A;
  --sage-light:  #E6EBD3;
  --sage-deep:   #5E6E3E;
  --border:      #D8B982;
  --border-soft: #E8D4A4;
  --tan:         #C9A36A;
  --shadow:      rgba(91, 55, 20, 0.16);
  --shadow-soft: rgba(91, 55, 20, 0.08);
  --shadow-deep: rgba(91, 55, 20, 0.28);
  --tape:        #F1E2BD;

  /* Archetype family colors */
  --fam-builders:     #A66A2E;
  --fam-experiencers: #C76A3A;
  --fam-guardians:    #7F8F5A;
  --fam-avoiders:     #8A7A95;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  --shadow-card: 0 2px 0 var(--border-soft), 0 8px 18px -6px var(--shadow);
  --shadow-paper: 0 1px 0 #fff inset, 0 2px 0 var(--border-soft), 0 14px 24px -10px var(--shadow);
  --shadow-press: 0 2px 6px -2px var(--shadow);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { background: #E8D8B8; }

body {
  font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.5;
  font-size: 16px;
  /* Outer "desk" — slightly darker so the device pops on desktop */
  background:
    radial-gradient(circle at 20% 10%, #F0E0BE 0%, #E8D8B8 60%, #DCC89A 100%);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ───────────────────────────────────────────────────────────
   PHONE FRAME — full-bleed on mobile, framed on desktop
   ─────────────────────────────────────────────────────────── */
.phone {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  background:
    /* faint grid */
    repeating-linear-gradient(0deg, rgba(168,130,72,0.07) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(168,130,72,0.07) 0 1px, transparent 1px 22px),
    /* paper tint */
    radial-gradient(120% 80% at 50% 0%, #FFF9EC 0%, var(--bg-cream) 60%, #F8EAD0 100%);
  border-radius: 0;
  overflow: hidden;
}

@media (min-width: 540px) {
  body { padding: 28px 16px; }
  .phone {
    margin: 0 auto;
    min-height: calc(100vh - 56px);
    max-height: 940px;
    border-radius: 44px;
    box-shadow:
      0 0 0 10px #2A170D,
      0 0 0 12px #4A2E1A,
      0 30px 60px -20px rgba(0,0,0,0.45),
      0 50px 100px -30px rgba(0,0,0,0.35);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--tan) transparent;
  }
  .phone::-webkit-scrollbar { width: 6px; }
  .phone::-webkit-scrollbar-thumb { background: var(--tan); border-radius: 3px; }
}

#app {
  padding: 22px 18px 110px;
  position: relative;
  z-index: 1;
}

/* ───────────────────────────────────────────────────────────
   AMBIENT DOODLES — generic finance/intake decorations
   Subtle; never compete with content
   ─────────────────────────────────────────────────────────── */
.doodle {
  position: absolute;
  pointer-events: none;
  opacity: 0.85;
  z-index: 0;
}
.doodle svg { display: block; }

/* paperclip top-left */
.doodle--clip { top: 6px; left: 8px; transform: rotate(-18deg); width: 44px; }
/* stamp top-right */
.doodle--stamp { top: 14px; right: 12px; width: 70px; }
/* coin stack bottom-right */
.doodle--coins { bottom: 100px; right: -6px; width: 86px; opacity: 0.75; }
/* receipt bottom-left */
.doodle--receipt { bottom: 80px; left: -6px; width: 64px; opacity: 0.7; transform: rotate(-6deg); }
/* wallet bottom-left for some screens */
.doodle--wallet { bottom: 28px; left: 6px; width: 78px; opacity: 0.7; }
/* calculator bottom-right alt */
.doodle--calc { bottom: 28px; right: 10px; width: 70px; opacity: 0.7; }
/* sparkles scattered */
.doodle--sparkle { width: 18px; opacity: 0.7; }

/* ───────────────────────────────────────────────────────────
   TOP BRAND PILL
   ─────────────────────────────────────────────────────────── */
.topbar {
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  padding: 36px 8px 14px;
  z-index: 2;
}
.topbar-back {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  margin-top: 11px; /* visually align with brand pill (accounts for padding) */
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: var(--ink);
  background: var(--paper-light);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 7px 14px 7px 11px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.01em;
  box-shadow: var(--shadow-card);
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.topbar-back:hover { transform: translateY(calc(-50% - 1px)); border-color: var(--honey-deep); color: var(--honey-deep); }
.topbar-back .arrow { font-size: 15px; line-height: 1; display: inline-block; }
.topbar-back .label { display: inline; }
@media (max-width: 520px) {
  .topbar-back { padding: 7px 10px; }
  .topbar-back .label { display: none; }
}
.brand-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--paper-light);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 9px 18px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.01em;
  color: var(--ink);
  box-shadow: var(--shadow-card);
}
.brand-pill .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--brown); flex: 0 0 auto; }
.brand-pill .brand-name { white-space: nowrap; }
.brand-pill .ring { color: var(--honey-deep); font-weight: 700; }

/* ───────────────────────────────────────────────────────────
   FOLDER-TAB PROGRESS
   ─────────────────────────────────────────────────────────── */
.tabs-wrap { margin: 6px -2px 8px; position: relative; z-index: 2; }
.tabs-row {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  padding: 0 2px;
}
.tabs-row + .tabs-row { margin-top: 6px; }

.tab {
  position: relative;
  height: 38px;
  border-radius: 6px 6px 4px 4px;
  background: var(--paper-warm);
  border: 1.5px solid var(--border);
  border-bottom-width: 2.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600;
  font-size: 12px;
  color: var(--brown);
  box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 2px 0 var(--border-soft);
}
/* folder tab "ear" on top-right */
.tab::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 0;
  width: 42%;
  height: 7px;
  background: var(--paper-warm);
  border: 1.5px solid var(--border);
  border-bottom: none;
  border-radius: 5px 5px 0 0;
}
.tab.done {
  background: var(--sage-light);
  border-color: #B7C28A;
  color: var(--sage-deep);
}
.tab.done::before { background: var(--sage-light); border-color: #B7C28A; border-bottom: none; }
.tab.done .check {
  position: absolute;
  right: 3px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--sage);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: #fff;
  font-weight: 800;
  line-height: 1;
}
.tab.current {
  background: var(--honey);
  border-color: var(--honey-deep);
  color: var(--ink);
  font-size: 16px;
  transform: translateY(-3px);
  box-shadow: 0 4px 0 var(--honey-deep), 0 8px 12px -4px var(--shadow);
  z-index: 2;
}
.tab.current::before { background: var(--honey); border-color: var(--honey-deep); border-bottom: none; }
.tab.current .spark {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  color: var(--honey-deep); font-size: 10px; font-weight: 700;
}
.tab.ellipsis { color: var(--brown-soft); font-size: 14px; letter-spacing: 1px; }

.progress-text {
  text-align: center;
  font-size: 12px;
  color: var(--brown);
  margin-top: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* ───────────────────────────────────────────────────────────
   CHAPTER CAPSULE LABEL
   ─────────────────────────────────────────────────────────── */
.chapter {
  display: flex;
  justify-content: center;
  margin: 10px 0 16px;
  position: relative;
  z-index: 2;
}
.chapter-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.01em;
  border: 1.5px solid;
}
.chapter-pill .dot { font-size: 10px; line-height: 1; }
/* themed by chapter family */
.chapter--money    { background: #FFF1CE; border-color: #E8C672; color: #8C6018; }
.chapter--drive    { background: #E6EBD3; border-color: #B7C28A; color: var(--sage-deep); }
.chapter--reality  { background: #DEE6F0; border-color: #A8BCD3; color: #3D5878; }
.chapter--identity { background: #ECDFEC; border-color: #C5A8CA; color: #6A4275; }

/* ───────────────────────────────────────────────────────────
   QUESTION PAPER CARD (washi-taped sheet)
   ─────────────────────────────────────────────────────────── */
.qcard {
  position: relative;
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 28px 22px 26px;
  margin: 0 0 18px;
  box-shadow: var(--shadow-paper);
  z-index: 2;
  /* paper texture */
  background-image:
    radial-gradient(circle at 14% 10%, rgba(168,130,72,0.04) 0 1px, transparent 1px),
    radial-gradient(circle at 78% 70%, rgba(168,130,72,0.05) 0 1px, transparent 1px);
  background-size: 12px 12px, 16px 16px;
}
/* folded corner */
.qcard::after {
  content: "";
  position: absolute;
  bottom: -1px; right: -1px;
  width: 28px; height: 28px;
  background:
    linear-gradient(135deg, transparent 50%, var(--border-soft) 50%, var(--border-soft) 56%, var(--paper-warm) 56%);
  border-bottom-right-radius: var(--radius-lg);
}
/* washi tape */
.tape {
  position: absolute;
  top: -10px; left: 22px;
  width: 64px; height: 20px;
  background:
    repeating-linear-gradient(90deg, transparent 0 6px, rgba(0,0,0,0.04) 6px 7px),
    var(--tape);
  border: 1px solid #D9C28A;
  border-radius: 2px;
  transform: rotate(-3deg);
  box-shadow: 0 2px 4px var(--shadow-soft);
  opacity: 0.95;
}
.tape.right { left: auto; right: 22px; transform: rotate(3deg); }

.qcard .qlabel {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--honey-deep);
  margin-bottom: 12px;
}
.qcard .qlabel.tb { color: #6A4275; }

.qcard .qtext {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 22px;
  letter-spacing: -0.01em;
  text-wrap: pretty;
}
.qcard .underline {
  display: block;
  width: 64%;
  height: 8px;
  margin: -8px 0 16px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 8'><path d='M2 5 Q 50 1 100 4 T 198 3' fill='none' stroke='%23F6B638' stroke-width='2' stroke-linecap='round'/></svg>") center/contain no-repeat;
}

/* ───────────────────────────────────────────────────────────
   ANSWER CARDS — raised paper with letter badge
   ─────────────────────────────────────────────────────────── */
.answers { display: flex; flex-direction: column; gap: 11px; }

.ans-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 14px 16px 14px 14px;
  text-align: left;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.4;
  color: var(--ink-soft);
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: transform 0.12s ease, border-color 0.12s, box-shadow 0.12s, background 0.12s;
  min-height: 64px;
}
.ans-btn:hover {
  border-color: var(--honey);
  transform: translateY(-1px);
  background: #FFFBF0;
}
.ans-btn:active { transform: translateY(0); box-shadow: var(--shadow-press); }
.ans-btn:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }

.ans-btn .badge {
  flex: 0 0 38px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--sage-light);
  border: 2px dashed #B7C28A;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--sage-deep);
}
.ans-btn .ans-text { flex: 1; }

/* selected state — gold ink stamp */
.ans-btn.chosen {
  background: #FFF6DC;
  border-color: var(--honey-deep);
  box-shadow: 0 2px 0 var(--honey-deep), 0 10px 18px -8px var(--shadow);
}
.ans-btn.chosen .badge {
  background: var(--honey);
  border-style: dashed;
  border-color: var(--honey-deep);
  color: var(--ink);
}
.ans-btn.chosen::after {
  content: "✓";
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%) rotate(-8deg);
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 2.5px solid var(--caramel);
  color: var(--caramel);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 20px;
  font-weight: 800;
  background: rgba(255,255,255,0.4);
  /* faint stamp opacity */
  opacity: 0.85;
}

/* ───────────────────────────────────────────────────────────
   COIN SCALE 1-5
   ─────────────────────────────────────────────────────────── */
.scale-poles {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--brown-soft);
  font-weight: 500;
  margin: 4px 4px 16px;
}
.coins-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  padding: 4px 0 8px;
}
.coin {
  position: relative;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #FFFCEC 0%, var(--paper-light) 60%, #F1E0B8 100%);
  border: 2.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 22px;
  color: var(--brown);
  cursor: pointer;
  box-shadow: 0 2px 0 var(--border), 0 6px 10px -4px var(--shadow);
  transition: transform 0.12s, border-color 0.12s, background 0.12s, box-shadow 0.12s;
}
.coin::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1.5px dashed #D8B98290;
  pointer-events: none;
}
.coin:hover { transform: translateY(-2px); border-color: var(--honey); }
.coin:focus-visible { outline: 3px solid var(--honey); outline-offset: 3px; }
.coin.chosen {
  background:
    radial-gradient(circle at 35% 30%, #FFE7A4 0%, var(--honey) 55%, var(--honey-deep) 100%);
  border-color: var(--honey-deep);
  color: var(--ink);
  transform: translateY(-4px) scale(1.05);
  box-shadow: 0 4px 0 var(--honey-deep), 0 10px 18px -6px var(--shadow);
}
.coin.chosen::before { border-color: #00000022; }
.coin.chosen::after {
  content: "";
  position: absolute;
  top: -16px; left: 50%;
  transform: translateX(-50%);
  width: 24px; height: 12px;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 12'><g stroke='%23F6B638' stroke-width='1.6' stroke-linecap='round'><line x1='12' y1='1' x2='12' y2='5'/><line x1='4' y1='3' x2='7' y2='6'/><line x1='20' y1='3' x2='17' y2='6'/></g></svg>") center/contain no-repeat;
}

/* ───────────────────────────────────────────────────────────
   PRIMARY / BACK BUTTONS — paper ticket style
   ─────────────────────────────────────────────────────────── */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: linear-gradient(180deg, var(--honey-light), var(--honey));
  color: var(--ink);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 17px;
  font-weight: 700;
  padding: 16px 22px;
  border-radius: 999px;
  border: 2px solid var(--honey-deep);
  cursor: pointer;
  margin-top: 4px;
  box-shadow: 0 3px 0 var(--honey-deep), 0 10px 18px -6px var(--shadow);
  transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
  letter-spacing: 0.01em;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--honey-deep), 0 14px 22px -6px var(--shadow); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--honey-deep); }
.btn-primary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn-primary:disabled {
  background: #E9D9B4; color: #A89066; border-color: #C9A36A;
  box-shadow: 0 2px 0 #C9A36A;
  cursor: not-allowed; transform: none;
}

.btn-back {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper-light);
  color: var(--brown);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 11px 22px;
  border-radius: 12px;
  border: 1.5px dashed var(--tan);
  cursor: pointer;
  margin-top: 16px;
  box-shadow: var(--shadow-card);
  transition: border-color 0.12s, color 0.12s;
}
.btn-back:hover { border-color: var(--brown); color: var(--ink); }
.btn-back:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }

.btn-row { display: flex; flex-direction: column; gap: 0; }

/* ───────────────────────────────────────────────────────────
   WELCOME SCREEN
   ─────────────────────────────────────────────────────────── */
.welcome-stamp {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 6px 0 14px;
}
.welcome-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 38px;
  font-weight: 800;
  line-height: 1.05;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  text-wrap: balance;
}
.welcome-sub {
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin-bottom: 22px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.stat {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 14px 6px;
  text-align: center;
  box-shadow: var(--shadow-card);
}
.stat-n {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 26px;
  font-weight: 800;
  color: var(--honey-deep);
  line-height: 1;
}
.stat-l {
  font-size: 10px;
  color: var(--brown-soft);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 6px;
  font-weight: 600;
}
.field-card {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-card);
}
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--brown);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
input[type=text] {
  width: 100%;
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--ink);
  font-size: 16px;
  font-family: inherit;
  outline: none;
}
input[type=text]::placeholder { color: #B0915C; }
input[type=text]:focus { border-color: var(--honey-deep); background: #FFFBF0; }

.welcome-tagline {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  color: var(--sage-deep);
  text-align: center;
  margin: 6px 0 18px;
  transform: rotate(-1deg);
}

.pilot-note {
  font-size: 11px;
  color: var(--brown-soft);
  text-align: center;
  margin-top: 18px;
  letter-spacing: 0.04em;
}

/* ───────────────────────────────────────────────────────────
   CHAPTER INTRO / TRANSITION (used between major sections)
   ─────────────────────────────────────────────────────────── */
.intro-card {
  position: relative;
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 36px 24px;
  text-align: center;
  margin-bottom: 18px;
  box-shadow: var(--shadow-paper);
}
.intro-eyebrow {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--sage-deep);
  margin-bottom: 12px;
}
.intro-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 36px;
  font-weight: 800;
  line-height: 1.05;
  color: var(--ink);
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.intro-body { font-size: 15px; line-height: 1.55; color: var(--ink-soft); }
.intro-divider {
  width: 56px; height: 2px;
  background: repeating-linear-gradient(90deg, var(--honey) 0 6px, transparent 6px 12px);
  margin: 14px auto;
}

/* ───────────────────────────────────────────────────────────
   IDENTITY CALIBRATION (TIE-BREAKER) — two folder-tab options
   ─────────────────────────────────────────────────────────── */
.tb-card {
  position: relative;
  border-radius: var(--radius-lg);
  padding: 22px 20px;
  margin-bottom: 14px;
  cursor: pointer;
  border: 2px solid;
  background: var(--paper-light);
  font-family: inherit;
  text-align: left;
  width: 100%;
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.12s, box-shadow 0.12s;
}
.tb-card::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 16px;
  width: 60px;
  height: 8px;
  background: inherit;
  border: 2px solid;
  border-color: inherit;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
}
.tb-card:hover { transform: translateY(-2px); }
.tb-card.honey { border-color: var(--honey-deep); background: #FFF7E0; }
.tb-card.sage  { border-color: #B7C28A; background: #F1F4E0; }
.tb-card .tb-text {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.25;
  color: var(--ink);
  flex: 1;
}
.tb-card .tb-arrow {
  flex: 0 0 36px;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
}
.tb-card.honey .tb-arrow { background: var(--honey-deep); }
.tb-card.sage  .tb-arrow { background: var(--sage); }
.tb-icon { font-size: 30px; }

/* ───────────────────────────────────────────────────────────
   LOADING / COMPILING SCREEN
   ─────────────────────────────────────────────────────────── */
.loading-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 32px;
  font-weight: 800;
  line-height: 1.05;
  color: var(--ink);
  letter-spacing: -0.02em;
  text-align: center;
  margin: 8px 16px 8px;
}
.loading-sub {
  font-size: 14px;
  color: var(--ink-soft);
  text-align: center;
  line-height: 1.5;
  margin-bottom: 18px;
}
.folder-illo {
  display: flex;
  justify-content: center;
  margin: 8px 0 22px;
}
.checklist {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  box-shadow: var(--shadow-card);
}
.check-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 4px;
  border-bottom: 1.5px dashed #E0CA8E;
}
.check-row:last-child { border-bottom: none; }
.cr-icon {
  flex: 0 0 36px;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px dashed #C9A36A;
  background: var(--paper-warm);
  display: flex; align-items: center; justify-content: center;
  color: var(--brown-soft);
  font-weight: 800;
  font-size: 14px;
}
.cr-icon.done { background: var(--sage); border-color: var(--sage-deep); color: #fff; border-style: solid; }
.cr-icon.active { background: var(--honey); border-color: var(--honey-deep); color: var(--ink); border-style: solid; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(246,182,56,0.4); }
  50% { transform: scale(1.07); box-shadow: 0 0 0 7px rgba(246,182,56,0); }
}
.cr-label {
  flex: 1;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.cr-stamp {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1.5px dashed;
}
.cr-stamp.done    { color: var(--sage-deep); border-color: var(--sage-deep); }
.cr-stamp.active  { color: var(--honey-deep); border-color: var(--honey-deep); }
.cr-stamp.pending { color: #B0915C; border-color: #C9A36A; }

/* ───────────────────────────────────────────────────────────
   RESULT SCREEN
   ─────────────────────────────────────────────────────────── */
.result-family-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: var(--sage-light);
  color: var(--sage-deep);
  border: 1.5px solid #B7C28A;
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 12px;
}
.result-family-pill.builders     { background: #F6E2C2; border-color: #E2BE7B; color: #7A4B1C; }
.result-family-pill.experiencers { background: #F8D7C2; border-color: #E8B58E; color: #8C4626; }
.result-family-pill.guardians    { background: var(--sage-light); border-color: #B7C28A; color: var(--sage-deep); }
.result-family-pill.avoiders     { background: #EADFEC; border-color: #C5A8CA; color: #6A4275; }

.result-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 36px;
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 4px;
  text-wrap: balance;
}
.result-monieid {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  color: var(--caramel);
  margin-bottom: 16px;
}

/* Card image slot — uses real BEGA asset if provided; otherwise a placeholder folder/card */
.card-slot {
  position: relative;
  width: 100%;
  aspect-ratio: 948 / 1659; /* matches BEGA card art (~4:7) */
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: #FFF6E6;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-paper);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-slot img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* Placeholder when image missing */
.card-ph {
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(45deg, rgba(168,130,72,0.06) 0 2px, transparent 2px 14px),
    radial-gradient(circle at 30% 20%, #FFF6DC 0%, var(--paper-warm) 50%, #E8C879 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
.card-ph .code {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 80px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1;
  letter-spacing: -0.04em;
  text-shadow: 2px 2px 0 #FFE7A4;
  margin-bottom: 10px;
}
.card-ph .ph-fam {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--brown);
  margin-bottom: 6px;
}
.card-ph .ph-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 26px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin-bottom: 14px;
  text-wrap: balance;
}
.card-ph .ph-stamp {
  display: inline-block;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--caramel);
  border: 2px dashed var(--caramel);
  padding: 5px 12px;
  border-radius: 6px;
  transform: rotate(-4deg);
  background: rgba(255,255,255,0.4);
}
.card-ph .ph-note {
  position: absolute;
  bottom: 10px; left: 10px; right: 10px;
  font-size: 10px;
  color: var(--brown-soft);
  font-family: 'Lexend', monospace;
  letter-spacing: 0.05em;
  font-weight: 500;
}

/* Result body content (deeper written profile) */
.result-card {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-card);
  position: relative;
}
.hook {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-style: italic;
  font-size: 18px;
  color: var(--caramel);
  margin-bottom: 22px;
  line-height: 1.4;
  border-left: 3px solid var(--honey);
  padding-left: 12px;
}
.sec-label {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brown);
  margin-bottom: 8px;
}
.res-section { margin-bottom: 22px; }
.res-section:last-child { margin-bottom: 0; }
.res-p {
  font-size: 14.5px;
  color: var(--ink-soft);
  line-height: 1.65;
  margin-bottom: 10px;
}
.res-p:last-child { margin-bottom: 0; }

.fear-box {
  background: #FFF1CE;
  border: 1.5px solid var(--honey-deep);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 22px;
  position: relative;
}
.fear-box::before {
  content: "❝";
  position: absolute;
  top: -8px; left: 10px;
  font-size: 28px;
  color: var(--honey-deep);
  background: var(--paper-light);
  padding: 0 6px;
  line-height: 1;
  font-family: 'Bricolage Grotesque', sans-serif;
}
.fear-text {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-style: italic;
  font-size: 15px;
  color: #8C6018;
  line-height: 1.5;
}

.tend-list { list-style: none; padding: 0; margin: 0; }
.tend-list li {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.55;
  padding: 9px 0 9px 22px;
  position: relative;
  border-bottom: 1px dashed #E0CA8E;
}
.tend-list li:last-child { border-bottom: none; }
.tend-list li::before {
  content: "✓";
  position: absolute;
  left: 0;
  color: var(--sage-deep);
  font-weight: 800;
}

.shadow-text {
  font-size: 13.5px;
  color: var(--brown);
  line-height: 1.65;
  margin-bottom: 8px;
}
.shadow-text:last-child { margin-bottom: 0; }

.flag {
  background: #FFF1CE;
  border: 1.5px solid var(--honey-deep);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  font-size: 13px;
  color: #6B3F22;
  line-height: 1.55;
  margin-top: 10px;
}
.flag::before { content: "⚑ "; color: var(--caramel); font-weight: 800; }

/* ───────────────────────────────────────────────────────────
   BRIDGE RESULT — two card thumbnails side by side
   ─────────────────────────────────────────────────────────── */
.bridge-cards {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 18px;
}
.bridge-card-slot {
  position: relative;
  aspect-ratio: 948 / 1659;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #FFF6E6;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-card);
}
.bridge-card-slot img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.bridge-x {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--caramel);
  text-align: center;
}
.bridge-pair {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-top: 14px;
}
.bridge-half {
  background: var(--paper);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 12px;
}
.bridge-half-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 15px;
  color: var(--ink);
  margin-bottom: 2px;
}
.bridge-half-fam {
  font-size: 10px; color: var(--brown-soft);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 8px; font-weight: 600;
}
.bridge-half-body {
  font-size: 12.5px; color: var(--ink-soft);
  line-height: 1.5;
}

/* ───────────────────────────────────────────────────────────
   ACTION BUTTONS — WhatsApp, blog, etc.
   ─────────────────────────────────────────────────────────── */
.btn-blog {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  background: var(--paper-light);
  color: var(--caramel);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  cursor: pointer;
  margin-bottom: 10px;
  text-decoration: none;
  text-align: center;
  box-shadow: var(--shadow-card);
  transition: background 0.12s, border-color 0.12s;
}
.btn-blog:hover { background: #FFF1CE; border-color: var(--honey-deep); }

.btn-whatsapp {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  background: #25D366;
  color: #FFF;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid #1EAE52;
  cursor: pointer;
  margin-bottom: 10px;
  box-shadow: 0 3px 0 #1EAE52, var(--shadow-card);
  transition: transform 0.12s;
}
.btn-whatsapp:hover { transform: translateY(-1px); }
.btn-whatsapp:active { transform: translateY(2px); box-shadow: 0 1px 0 #1EAE52; }

.btn-tally-wrap {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 22px 18px;
  margin-bottom: 14px;
  text-align: center;
  box-shadow: var(--shadow-card);
}
.btn-tally-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 17px; font-weight: 700;
  color: var(--ink); margin-bottom: 6px;
}
.btn-tally-sub {
  font-size: 13px;
  color: var(--brown-soft);
  margin-bottom: 14px; line-height: 1.5;
}
.btn-tally {
  display: inline-flex;
  align-items: center;
  background: linear-gradient(180deg, var(--honey-light), var(--honey));
  color: var(--ink);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 15px; font-weight: 700;
  padding: 12px 22px;
  border-radius: 999px;
  border: 2px solid var(--honey-deep);
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 3px 0 var(--honey-deep);
}

/* Scores list */
.scores-card {
  background: var(--paper-light);
  border: 1.5px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 18px 18px 12px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-card);
}
.score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.score-name { font-size: 12px; width: 132px; color: var(--brown); font-weight: 500; }
.score-name.top { color: var(--honey-deep); font-weight: 700; }
.score-bg { flex: 1; height: 8px; background: var(--paper-warm); border-radius: 4px; border: 1px solid var(--border-soft); overflow: hidden; }
.score-bar { height: 100%; background: linear-gradient(90deg, var(--honey-light), var(--honey)); border-radius: 4px; }
.score-bar.dim { background: var(--tan); opacity: 0.5; }
.score-val { font-size: 11px; color: var(--brown-soft); width: 30px; text-align: right; font-weight: 600; }

/* ───────────────────────────────────────────────────────────
   VALIDATION SCREEN
   ─────────────────────────────────────────────────────────── */
.val-q {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 12px;
}
.val-opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
.val-btn {
  background: var(--paper);
  border: 1.5px solid var(--border-soft);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--ink-soft);
  font-size: 14px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all 0.12s;
}
.val-btn:hover { border-color: var(--honey); }
.val-btn.chosen { background: #FFF6DC; border-color: var(--honey-deep); color: var(--ink); font-weight: 600; }
.stars { display: flex; gap: 10px; margin-bottom: 24px; }
.star { font-size: 32px; cursor: pointer; opacity: 0.3; color: var(--honey-deep); transition: opacity 0.12s, transform 0.12s; line-height: 1; }
.star.on { opacity: 1; transform: scale(1.05); }
textarea {
  width: 100%;
  background: var(--paper);
  border: 1.5px solid var(--border-soft);
  border-radius: 12px;
  padding: 12px;
  color: var(--ink-soft);
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  min-height: 80px;
}
textarea:focus { outline: none; border-color: var(--honey-deep); }
.export-box {
  background: var(--paper-warm);
  border: 1.5px solid var(--border-soft);
  border-radius: 10px;
  padding: 12px;
  font-family: 'Lexend', monospace;
  font-size: 11px;
  color: var(--brown);
  word-break: break-all;
  max-height: 220px;
  overflow-y: auto;
  margin-bottom: 10px;
  white-space: pre-wrap;
}
.btn-copy {
  background: var(--sage-light);
  border: 1.5px solid #B7C28A;
  border-radius: 10px;
  padding: 12px 16px;
  color: var(--sage-deep);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
}
.btn-copy:hover { background: #DAE3BC; }
.btn-restart {
  background: transparent;
  border: 1.5px dashed var(--tan);
  border-radius: 10px;
  padding: 10px 16px;
  color: var(--brown-soft);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  width: 100%;
  margin-top: 8px;
}
.btn-restart:hover { color: var(--brown); border-color: var(--brown); }

/* ───────────────────────────────────────────────────────────
   ACCESSIBILITY — reduced motion, focus
   ─────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

button { font-family: inherit; }
button:focus-visible { outline: 3px solid var(--honey-deep); outline-offset: 2px; }

/* small screens */
@media (max-width: 360px) {
  .welcome-title, .intro-title, .loading-title { font-size: 30px; }
  .result-name { font-size: 30px; }
  .qcard .qtext { font-size: 20px; }
  #app { padding: 18px 14px 90px; }
  .coin { font-size: 18px; }
}

/* ─── PRINT STYLESHEET ─── */
@media print {
  html, body { background: #FFFFFF !important; }
  body { padding: 0 !important; font-size: 12pt; line-height: 1.55; }
  .phone, .sheet, .page {
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    min-height: 0 !important;
    max-height: none !important;

function resetState() {
  S = { screen:"welcome", name:S.name, scores:{}, scaleAns:{}, mainAns:[], tbPair:null, tbQs:[], tbAns:[], result:null, bridge:null, flags:[], qi:0, val:{}, loadingStep:0 };
  Object.keys(ARC).forEach(k => S.scores[k] = 0);
}

/* ═══════════════════════════════════════════════════════════
   SCORING — unchanged from original
   ═══════════════════════════════════════════════════════════ */

function scoreChoice(primary) {
  S.scores[primary] += 2.0;
  const fam = ARC[primary].fam;
  FAM[fam].forEach(c => { if (c !== primary) S.scores[c] += 0.5; });
}
function unscoreChoice(primary) {
  S.scores[primary] -= 2.0;
  const fam = ARC[primary].fam;
  FAM[fam].forEach(c => { if (c !== primary) S.scores[c] -= 0.5; });
}
function topTwo() {
  return Object.entries(S.scores).sort((x,y) => y[1]-x[1]).slice(0,2);
}
function tbKey(a, b) { return [a,b].sort().join("-"); }

function checkTB() {
  var t2 = topTwo();
  var gap = t2[0][1] - t2[1][1];
  if (gap > 1.0) return null;
  var key = tbKey(t2[0][0], t2[1][0]);
  var qs = TB[key];
  if (qs) return { pair:[t2[0][0],t2[1][0]], qs:qs };
  return { pair:[t2[0][0],t2[1][0]], bridge:true };
}

function calcFlags(code) {
  var fam = ARC[code].fam;
  var isBuilder = fam === "Builders";
  var q13 = S.scaleAns.Q13||0, q14 = S.scaleAns.Q14||0, q15 = S.scaleAns.Q15||0, q16 = S.scaleAns.Q16||0;
  if (q13 <= 2 && isBuilder)
    S.flags.push("You identify as a " + ARC[code].name + " but tend to avoid checking your finances under stress. Your risk is not the market — it is your own stress response pulling you away from the plan when it matters most.");
  if (q14 >= 4 && code === "AB")
    S.flags.push("You move fast by instinct — but your behavioral data shows more deliberation than you give yourself credit for. You may be an Aggressive Builder who has developed process maturity.");
  if (q15 >= 4 && isBuilder)
    S.flags.push("Your strategy is solid — but your behavior shows emotional spending spikes, particularly under stress. Your biggest risk is not the plan. It is what happens when the plan meets a bad day.");
  if (q16 <= 2 && (code === "WA" || code === "SG"))
    S.flags.push("You know what to do — but executing consistently under pressure is a separate skill. Your biggest gap is not knowledge. It is follow-through when discomfort arrives.");
}

function resolveTBResult() {
  var counts = {};
  S.tbAns.forEach(c => counts[c] = (counts[c]||0)+1);
  var a = S.tbPair[0], b = S.tbPair[1];
  var ca = counts[a]||0, cb = counts[b]||0;
  if (ca === cb) { S.result = "BRIDGE"; S.bridge = S.tbPair; return; }
  var winner = ca > cb ? a : b;
  calcFlags(winner);
  S.result = winner;
}

/* COMMON: folder-tab progress (16 tabs total, condensed with ellipsis when needed) */
function folderTabs(current, total, doneRange) {
  // Show all 16 if total === 16 in two rows of 8.
  // For tie-breaker (total=3) show a 3-tab condensed row.
  if (total === 16) {
    var rows = ['', ''];
    for (var i = 1; i <= 16; i++) {
      var row = i <= 8 ? 0 : 1;
      var cls = 'tab';
      if (i < current) cls += ' done';
      else if (i === current) cls += ' current';
      var inner = '<span>' + i + '</span>' +
        (i < current ? '<span class="check">✓</span>' : '') +
        (i === current ? '<span class="spark">✦</span>' : '');
      rows[row] += '<div class="tab ' + (cls.replace('tab ', '')) + '">' + inner + '</div>';
    }
    return '<div class="tabs-wrap">' +
      '<div class="tabs-row">' + rows[0] + '</div>' +
      '<div class="tabs-row">' + rows[1] + '</div>' +
      '<div class="progress-text">Question ' + current + ' of 16</div>' +
    '</div>';
  }
  // condensed mode (3 cells)
  var html = '<div class="tabs-wrap"><div class="tabs-row" style="grid-template-columns:repeat(' + total + ',1fr);">';
  for (var j = 1; j <= total; j++) {
    var c = 'tab';
    if (j < current) c += ' done';
    else if (j === current) c += ' current';
    html += '<div class="' + c + '">' + j +
      (j < current ? '<span class="check">✓</span>' : '') +
      (j === current ? '<span class="spark">✦</span>' : '') +
    '</div>';
  }
  html += '</div><div class="progress-text">Step ' + current + ' of ' + total + '</div></div>';
  return html;
}

function ambientDoodles(variant) {

            doodleHtml('wallet', 'doodle--wallet');
  }
  return html;
}

    '<div style="position:relative;z-index:2;">' +
      '<div style="text-align:center;margin-bottom:14px;">' +
        '<div class="result-family-pill" style="background:#EADFEC;border-color:#C5A8CA;color:#6A4275;">Bridge Identity</div>' +
        '<div class="result-name">' + escHtml(ARC[a].name) + ' <span style="color:var(--caramel)">×</span> ' + escHtml(ARC[b].name) + '</div>' +
        '<div class="result-monieid">Your Monie ID ✦</div>' +
      '</div>' +
      /* TWO BEGA CARD THUMBNAILS */
      '<div class="bridge-cards">' +
        bridgeCardHtml(a) +
        '<div class="bridge-x">×</div>' +
        bridgeCardHtml(b) +
      '</div>' +
      '<div class="result-card">' +
        '<div class="res-p" style="font-size:15px;color:var(--ink-soft);margin-bottom:10px;">' + escHtml(bridgeCopy) + '</div>' +
        '<div class="bridge-pair">' +
          '<div class="bridge-half">' +
            '<div class="bridge-half-name">' + escHtml(ARC[a].name) + '</div>' +
            '<div class="bridge-half-fam">' + escHtml(ARC[a].fam) + '</div>' +
            '<div class="bridge-half-body">' + escHtml(ARC[a].identity[0]) + '</div>' +
          '</div>' +
          '<div class="bridge-half">' +
            '<div class="bridge-half-name">' + escHtml(ARC[b].name) + '</div>' +
            '<div class="bridge-half-fam">' + escHtml(ARC[b].fam) + '</div>' +
            '<div class="bridge-half-body">' + escHtml(ARC[b].identity[0]) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;margin-top:16px">' +
          '<button class="btn-blog" onclick="navigateAway(\'./archetypes/' + SLUGS[a] + '.html\')" style="margin-bottom:0;font-size:13px;padding:11px 10px">' + escHtml(ARC[a].name) + ' profile →</button>' +
          '<button class="btn-blog" onclick="navigateAway(\'./archetypes/' + SLUGS[b] + '.html\')" style="margin-bottom:0;font-size:13px;padding:11px 10px">' + escHtml(ARC[b].name) + ' profile →</button>' +
        '</div>' +
      '</div>' +
      '<button class="btn-whatsapp" onclick="shareWhatsApp(null,[\'' + a + '\',\'' + b + '\'])">💬 Challenge a friend on WhatsApp</button>' +
      '<button class="btn-blog" onclick="navigateAway(\'' + COMPAT_URL + '?a=' + a + '&b=' + b + '\')">🔁 See your compatibility →</button>' +
      (TALLY_FORM_URL ? '<div class="btn-tally-wrap">' +
        '<div class="btn-tally-title">Want your personalised money report?</div>' +
        '<div class="btn-tally-sub">Get a deeper breakdown of your Bridge identity delivered to your inbox.</div>' +
        '<a class="btn-tally" href="' + escHtml(TALLY_FORM_URL) + '" target="_blank" rel="noopener">Get my report →</a>' +
      '</div>' : '') +
      '<div class="scores-card">' +
        '<div class="sec-label" style="margin-bottom:14px">All 11 scores</div>' +
        sorted.map(function(e) {
          var c = e[0], v = e[1];
          var pct = maxS > 0 ? Math.round(v / maxS * 100) : 0;
          var isTop = (c === a || c === b);
          return '<div class="score-row">' +
            '<div class="score-name' + (isTop ? ' top' : '') + '">' + escHtml(ARC[c].name) + '</div>' +
            '<div class="score-bg"><div class="score-bar' + (isTop ? '' : ' dim') + '" style="width:' + Math.max(pct, 0) + '%"></div></div>' +
            '<div class="score-val">' + v.toFixed(1) + '</div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<button class="btn-primary" onclick="goVal()">Continue to Feedback →</button>' +
      '<button class="btn-back" onclick="goBack()">← Back to Q16</button>' +
    '</div>';
}

/* ───────────────────────────────────────────────────────────
   9. VALIDATION / FEEDBACK SCREEN
   ─────────────────────────────────────────────────────────── */
function rValidate() {
  var v = S.val;
  var resOpts = ["Yes, that's me", "Mostly yes", "Somewhat", "Not really", "No, wrong"];
  var canSub = (v.res !== undefined) && v.pick && v.rating;
  return topbar() +
    ambientDoodles('b') +
    '<div style="position:relative;z-index:2;">' +
      '<div class="welcome-tagline">file feedback ↓</div>' +
      '<div class="welcome-title" style="font-size:30px;margin-bottom:18px;">Help us calibrate</div>' +
      '<div class="result-card">' +
        '<div class="val-q">Does your result feel accurate?</div>' +
        '<div class="val-opts">' +
          resOpts.map(function(opt, i) {
            return '<button class="val-btn' + (v.res === i ? ' chosen' : '') + '" onclick="setV(\'res\',' + i + ')">' + escHtml(opt) + '</button>';
          }).join('') +
        '</div>' +
        '<div class="val-q">Which archetype actually feels most accurate to you?</div>' +
        '<div class="val-opts">' +
          Object.keys(ARC).map(function(code) {
            return '<button class="val-btn' + (v.pick === code ? ' chosen' : '') + '" onclick="setV(\'pick\',\'' + code + '\')">' +
              escHtml(ARC[code].name) + '<span style="color:var(--brown-soft);font-size:12px"> — ' + escHtml(ARC[code].fam) + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
        '<div class="val-q">How accurately does this describe your real money behavior? (1–5)</div>' +
        '<div class="stars">' +
          [1,2,3,4,5].map(n => '<span class="star' + ((v.rating || 0) >= n ? ' on' : '') + '" onclick="setV(\'rating\',' + n + ')" role="button" aria-label="' + n + ' stars">★</span>').join('') +
        '</div>' +
        '<div class="val-q">Anything to add? (optional)</div>' +
        '<textarea placeholder="What felt off? What resonated?" oninput="setV(\'note\',this.value)">' + escHtml(v.note || '') + '</textarea>' +
      '</div>' +
      '<button class="btn-primary" onclick="submitVal()" ' + (canSub ? '' : 'disabled') + '>Export My Data →</button>' +
      (v.exported ? renderExport() : '') +
      '<button class="btn-back" onclick="goBack()">← Back to result</button>' +
      '<button class="btn-restart" onclick="restart()">↺ Start over</button>' +
    '</div>';
}

function renderExport() {
  var data = buildExport();
  var json = JSON.stringify(data, null, 2);
  return '<div class="result-card" style="margin-top:16px">' +
    '<div class="sec-label" style="margin-bottom:8px">Pilot data (copy and send to team)</div>' +
    '<div class="export-box" id="expBox">' + escHtml(json) + '</div>' +
    '<button class="btn-copy" onclick="doCopy()">📋 Copy to clipboard</button>' +
    '<div style="font-size:12px;color:var(--brown-soft);text-align:center;margin-top:10px">Thank you for helping validate duRingIt 🙏</div>' +
  '</div>';
}

function buildExport() {
  var sorted = Object.entries(S.scores).sort((x, y) => y[1] - x[1]);
  var resLabel = S.result === "BRIDGE"
    ? "Bridge: " + S.bridge.map(c => ARC[c].name).join(" × ")
    : ARC[S.result].name;
  var resOpts = ["Yes, that's me", "Mostly yes", "Somewhat", "Not really", "No, wrong"];
  return {
    timestamp: new Date().toISOString(),
    pilot: "v1.0",
    name: S.name || "anonymous",
    scores: Object.fromEntries(sorted.map(function(e) { return [ARC[e[0]].name, +e[1].toFixed(1)]; })),
    result: resLabel,
    tiebreaker_triggered: S.tbPair !== null,
    tiebreaker_answers: S.tbAns.map(c => ARC[c].name),
    contradiction_flags: S.flags,
    validation: {
      resonates: S.val.res !== undefined ? resOpts[S.val.res] : null,
      most_accurate: S.val.pick ? ARC[S.val.pick].name : null,
      accuracy_rating: S.val.rating || null,
      notes: S.val.note || null
    }
  };
}

/* ═══════════════════════════════════════════════════════════
   HANDLERS — preserved logic from original
   Only addition: loading screen between Q16 and result
   ═══════════════════════════════════════════════════════════ */

function goBack() {
  if (S.screen === 'validate') {
    S.screen = 'result'; render(); scrollTo(0, 0); return;
  }
  if (S.screen === 'result') {
    // Clear result state; go back to Q16 (last scale question)
    S.result = null; S.bridge = null; S.flags = [];
    S.tbAns = []; S.tbQs = []; S.tbPair = null;
    S.screen = 'scale'; S.qi = SCALE_QS.length - 1;
    render(); scrollTo(0, 0); return;
  }
  if (S.screen === 'loading') {
    // Cancel loading: go back to last scale question
    S.loadingStep = 0;
    S.screen = 'scale'; S.qi = SCALE_QS.length - 1;
    render(); scrollTo(0, 0); return;
  }
  if (S.screen === 'tb') {
    if (S.qi === 0) {
      S.tbAns = []; S.tbQs = []; S.tbPair = null;
      S.screen = 'scale'; S.qi = SCALE_QS.length - 1;
    } else {
      S.qi--;
      S.tbAns.pop();
    }
    render(); scrollTo(0, 0); return;
  }
  if (S.screen === 'scale') {
    if (S.qi === 0) {
      removeScaleScores();
      S.scaleAns = {};
      var lastIdx = MAIN_QS.length - 1;
      var prevAns = S.mainAns[lastIdx];
      if (prevAns !== undefined) {
        unscoreChoice(MAIN_QS[lastIdx].ans[prevAns].p);
        S.mainAns.splice(lastIdx, 1);
      }
      S.screen = 'main'; S.qi = lastIdx;
    } else {
      S.qi--;
    }
    render(); scrollTo(0, 0); return;
  }
  if (S.screen === 'main') {
    if (S.qi === 0) {
      S.screen = 'welcome';
    } else {
      var prevQi = S.qi - 1;
      var prevAns2 = S.mainAns[prevQi];
      if (prevAns2 !== undefined) {
        unscoreChoice(MAIN_QS[prevQi].ans[prevAns2].p);
        S.mainAns.splice(prevQi, 1);
      }
      S.qi--;
    }
    render(); scrollTo(0, 0); return;
  }
}

function startQuiz() {
  var el = document.getElementById("nameIn");
  S.name = el ? el.value.trim() : "";
  S.screen = "main";
  S.qi = 0;
  render();
  scrollTo(0, 0);
}

function pickMain(idx) {
  var q = MAIN_QS[S.qi];
  var primary = q.ans[idx].p;
  var btns = document.querySelectorAll(".ans-btn");
  if (btns[idx]) btns[idx].classList.add("chosen");
  S.mainAns[S.qi] = idx;
  scoreChoice(primary);
  setTimeout(function() {
    S.qi++;
    if (S.qi >= MAIN_QS.length) { S.screen = "scale"; S.qi = 0; }
    render(); scrollTo(0, 0);
  }, 260);
}

/* Scale weighting — unchanged from original */
var SCALE_WEIGHTS = {
  Q13: { WA: 0.3, SG: 0.3, ST: 0.3, EE: -0.3 },
  Q14: { AX: 0.3, ST: 0.2, AB: -0.3 },
  Q15: { LR: 0.3, LI: 0.3, EE: 0.3, WA: -0.3, FC: -0.2 },
  Q16: { WA: 0.3, SG: 0.3, FC: 0.25, LR: -0.3, EE: -0.3, WN: -0.25 }
};

function applyScaleScores() {
  Object.keys(SCALE_WEIGHTS).forEach(function(qid) {
    var val = S.scaleAns[qid] || 0;
    if (!val) return;
    var delta = val - 3;
    var weights = SCALE_WEIGHTS[qid];
    Object.keys(weights).forEach(function(arc) {
      S.scores[arc] = (S.scores[arc] || 0) + delta * weights[arc];
    });
  });
}

function removeScaleScores() {
  Object.keys(SCALE_WEIGHTS).forEach(function(qid) {
    var val = S.scaleAns[qid] || 0;
    if (!val) return;
    var delta = val - 3;
    var weights = SCALE_WEIGHTS[qid];
    Object.keys(weights).forEach(function(arc) {
      S.scores[arc] = (S.scores[arc] || 0) - delta * weights[arc];
    });
  });
}

function pickScale(qid, dot) {
  var oldVal = S.scaleAns[qid] || 0;
  if (oldVal) {
    var oldDelta = oldVal - 3;
    var weights = SCALE_WEIGHTS[qid];
    Object.keys(weights).forEach(function(arc) {
      S.scores[arc] = (S.scores[arc] || 0) - oldDelta * weights[arc];
    });
  }
  S.scaleAns[qid] = dot;
  var newDelta = dot - 3;
  var weights2 = SCALE_WEIGHTS[qid];
  Object.keys(weights2).forEach(function(arc) {
    S.scores[arc] = (S.scores[arc] || 0) + newDelta * weights2[arc];
  });
  render();
}

function nextScale() {
  S.qi++;
  if (S.qi >= SCALE_QS.length) {
    // Show loading screen, then compute result
    runLoading();
  } else {
    render(); scrollTo(0, 0);
  }
}

/* LOADING animation: 4 steps, ~600ms each, total ~2.4s, then resolve */
function runLoading() {
  S.screen = 'loading';
  S.loadingStep = 0;
  render(); scrollTo(0, 0);
  var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stepMs = prefersReduced ? 80 : 600;
  function tick() {
    S.loadingStep++;
    if (S.loadingStep >= LOADING_STEPS.length) {
      finishToResult();
      return;
    }
    render();
    setTimeout(tick, stepMs);
  }
  setTimeout(tick, stepMs);
}

function finishToResult() {
  var tb = checkTB();
  if (!tb) {
    var winner = topTwo()[0][0];
    calcFlags(winner);
    S.result = winner;
    S.screen = "result";
  } else if (tb.bridge) {
    S.result = "BRIDGE";
    S.bridge = tb.pair;
    S.screen = "result";
  } else {
    S.tbPair = tb.pair;
    S.tbQs = tb.qs;
    S.qi = 0;
    S.screen = "tb";
  }
  render(); scrollTo(0, 0);
}

function pickTB(code) {
  S.tbAns.push(code);
  var btns = document.querySelectorAll(".tb-card");
  btns.forEach(function(b) {
    var labelText = code === S.tbQs[S.qi].a.c ? S.tbQs[S.qi].a.t : S.tbQs[S.qi].b.t;
    if (b.textContent.indexOf(labelText) !== -1) b.classList.add("chosen");
  });
  setTimeout(function() {
    S.qi++;
    if (S.qi >= 3) {
      resolveTBResult();
      // After tie-breaker, route through loading screen too
      runLoading();
    } else {
      render(); scrollTo(0, 0);
    }
  }, 220);
}

/* After tie-breaker we set S.result already; runLoading -> finishToResult
   would normally re-check TB and either present or branch. We need a small
   adjustment: when S.result is set already, just go straight to result. */
var _origFinishToResult = finishToResult;
finishToResult = function() {
  if (S.result) {
    S.screen = "result";
    render(); scrollTo(0, 0);
    return;
  }
  _origFinishToResult();
};

function goVal() { S.screen = "validate"; render(); scrollTo(0, 0); }

function setV(key, val) {
  S.val[key] = val;
  render();
}

function submitVal() {
  S.val.exported = true;
  render();
  setTimeout(doCopy, 300);
}

function doCopy() {
  var text = JSON.stringify(buildExport(), null, 2);
  var btn = document.querySelector(".btn-copy");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      if (btn) { btn.textContent = "✓ Copied!"; setTimeout(function() { if (btn) btn.textContent = "📋 Copy to clipboard"; }, 2000); }
    }).catch(function() { fallbackCopy(text, btn); });
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  var el = document.createElement("textarea");
  el.value = text; document.body.appendChild(el); el.select(); document.execCommand("copy"); document.body.removeChild(el);
  if (btn) { btn.textContent = "✓ Copied!"; setTimeout(function() { if (btn) btn.textContent = "📋 Copy to clipboard"; }, 2000); }
}

function restart() {
  /* Clear any quiz state, then send the user back to the landing page.
     This is the friendliest entry point now that a homepage exists. */
  try { sessionStorage.removeItem('_quizState'); } catch (e) {}
  resetState();
  window.location.href = "./index.html";
}

function escHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* State persistence — unchanged */
function navigateAway(url) {
  try { sessionStorage.setItem('_quizState', JSON.stringify(S)); } catch (e) {}
  window.location.href = url;
}

(function() {
  try {
    var saved = sessionStorage.getItem('_quizState');
    if (saved) {
      var parsed = JSON.parse(saved);
      sessionStorage.removeItem('_quizState');
      if (parsed && (parsed.screen === 'result' || parsed.screen === 'validate')) {
        S = parsed;
        if (!S.scores)    S.scores    = {};
        if (!S.flags)     S.flags     = [];
        if (!S.tbAns)     S.tbAns     = [];
        if (!S.tbQs)      S.tbQs      = [];
        if (!S.scaleAns)  S.scaleAns  = {};
        if (!S.mainAns)   S.mainAns   = [];
        if (!S.val)       S.val       = {};
        if (S.loadingStep === undefined) S.loadingStep = 0;
      }
    }
  } catch (e) {}
})();

render();
</script>
</body>
