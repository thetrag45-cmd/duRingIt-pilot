.bridge-half-fam { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.bridge-half-body { font-size: 12px; color: #888; line-height: 1.5; }
.val-q { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #DDD; }

.val-btn {

  border-radius: 10px; padding: 12px 16px;

.stars { display: flex; gap: 10px; margin-bottom: 24px; }
.star { font-size: 30px; cursor: pointer; opacity: 0.25; transition: opacity 0.12s; }

.btn-copy:hover { border-color: #F5C842; color: #FFF; }
.btn-restart {

  border-radius: 8px; padding: 10px 16px;

.btn-restart:hover { color: #999; border-color: #555; }
.pilot-note { font-size: 11px; color: #333; text-align: center; margin-top: 14px; }

      b:{ t:"What this move says about who I am and where I'm positioning myself.", c:"SS" } },
    { text:"Winning financially means:",
      a:{ t:"Building something significantly larger than where I started.", c:"AB" },
      b:{ t:"Being clearly recognised as someone who has genuinely made it.", c:"SS" } }
  ],
  "EE-FC": [
    { text:"Your relationship with financial obligations right now is:",
      a:{ t:"I'm systematically reducing them — every move is designed to own more of my time.", c:"FC" },
      b:{ t:"They weigh on me more than I let on — I'd rather not face them directly.", c:"EE" } },
    { text:"In 5 years, your clearest financial goal is:",
      a:{ t:"To have enough that I never have to do something purely for the money again.", c:"FC" },
      b:{ t:"I'm not sure — I have not really let myself think that concretely about it.", c:"EE" } },
    { text:"When you hear people talk about financial freedom, you feel:",
      a:{ t:"Motivated — that's the exact thing I'm building toward, step by step.", c:"FC" },
      b:{ t:"Wistful but disconnected — it feels like something that happens for other people.", c:"EE" } }
  ]
};

const FAM_CHARS = {
  Builders:     "strategic, growth-oriented action",
  Experiencers: "present-moment expression and experience",
  Guardians:    "security and careful protection",
  Avoiders:     "avoidance and disengagement from money"
};

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────

var S = {
  screen: "welcome",
  name: "",
  scores: {},
  scaleAns: {},
  tbPair: null,
  tbQs: [],
  tbAns: [],
  result: null,
  bridge: null,
  flags: [],
  qi: 0,
  val: {}
};

function resetState() {
  S = { screen:"welcome", name:S.name, scores:{}, scaleAns:{}, tbPair:null, tbQs:[], tbAns:[], result:null, bridge:null, flags:[], qi:0, val:{} };
  Object.keys(ARC).forEach(k => S.scores[k] = 0);
}
resetState();

// ─────────────────────────────────────────────
// SCORING
// ─────────────────────────────────────────────

function scoreChoice(primary) {
  S.scores[primary] += 2.0;
  const fam = ARC[primary].fam;
  FAM[fam].forEach(c => { if (c !== primary) S.scores[c] += 0.5; });
}

function topTwo() {
  return Object.entries(S.scores).sort((x,y) => y[1]-x[1]).slice(0,2);
}

function tbKey(a, b) { return [a,b].sort().join("-"); }

function checkTB() {
  var t2 = topTwo();
  var gap = t2[0][1] - t2[1][1];
  if (gap > 1.0) return null;
  var key = tbKey(t2[0][0], t2[1][0]);
  var qs = TB[key];
  if (qs) return { pair:[t2[0][0],t2[1][0]], qs:qs };
  return { pair:[t2[0][0],t2[1][0]], bridge:true };
}

function calcFlags(code) {
  var fam = ARC[code].fam;
  var isBuilder = fam === "Builders";
  var q13 = S.scaleAns.Q13||0, q14 = S.scaleAns.Q14||0, q15 = S.scaleAns.Q15||0, q16 = S.scaleAns.Q16||0;
  if (q13 <= 2 && isBuilder)
    S.flags.push("You identify as a " + ARC[code].name + " but tend to avoid checking your finances under stress. Your risk is not the market — it is your own stress response pulling you away from the plan when it matters most.");
  if (q14 >= 4 && code === "AB")
    S.flags.push("You move fast by instinct — but your behavioral data shows more deliberation than you give yourself credit for. You may be an Aggressive Builder who has developed process maturity.");
  if (q15 >= 4 && isBuilder)
    S.flags.push("Your strategy is solid — but your behavior shows emotional spending spikes, particularly under stress. Your biggest risk is not the plan. It is what happens when the plan meets a bad day.");
  if (q16 <= 2 && (code === "WA" || code === "SG"))
    S.flags.push("You know what to do — but executing consistently under pressure is a separate skill. Your biggest gap is not knowledge. It is follow-through when discomfort arrives.");
}

function resolveTBResult() {
  var counts = {};
  S.tbAns.forEach(c => counts[c] = (counts[c]||0)+1);
  var a = S.tbPair[0], b = S.tbPair[1];
  var ca = counts[a]||0, cb = counts[b]||0;
  if (ca === cb) { S.result = "BRIDGE"; S.bridge = S.tbPair; return; }
  var winner = ca > cb ? a : b;
  calcFlags(winner);
  S.result = winner;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────

function render() {
  var app = document.getElementById("app");
  switch(S.screen) {
    case "welcome":   app.innerHTML = rWelcome(); break;
    case "main":      app.innerHTML = rMain(); break;
    case "scale":     app.innerHTML = rScale(); break;
    case "tb":        app.innerHTML = rTB(); break;
    case "result":    app.innerHTML = rResult(); break;
    case "validate":  app.innerHTML = rValidate(); break;
  }
}

function prog(n, total, label) {
  var pct = Math.round(n/total*100);
  return '<div class="progress-wrap"><div class="progress-bg"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="progress-text">'+label+'</div></div>';
}

function rWelcome() {
  return '<div class="brand">du<span>Ring</span>It — Monie ID</div>'+
    '<div class="welcome-title">What kind of money person are you?</div>'+
    '<div class="welcome-sub">Not what you think you are. What you actually are.<br>16 questions. ~4 minutes.</div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="stat-n">11</div><div class="stat-l">Archetypes</div></div>'+
      '<div class="stat"><div class="stat-n">16</div><div class="stat-l">Questions</div></div>'+
      '<div class="stat"><div class="stat-n">~91%</div><div class="stat-l">Accuracy</div></div>'+
    '</div>'+
    '<div class="card">'+
      '<div style="font-size:13px;color:#666;margin-bottom:10px;">Your name (optional)</div>'+
      '<input type="text" id="nameIn" placeholder="e.g. Sarah" value="'+escHtml(S.name)+'" autocomplete="off">'+
    '</div>'+
    '<button class="btn-primary" onclick="startQuiz()">Find My Monie ID →</button>'+
    '<div class="pilot-note">Pilot v1.0 — Your answers help validate the quiz</div>';
}

function rMain() {
  var q = MAIN_QS[S.qi];
  var n = S.qi + 1;
  return '<div class="brand">du<span>Ring</span>It — Monie ID</div>'+
    prog(n, 16, 'Question '+n+' of 16 &nbsp;·&nbsp; '+q.ph)+
    '<div class="card" style="margin-top:16px;">'+
      '<div class="q-label">'+q.id+'</div>'+
      '<div class="q-text">'+escHtml(q.text)+'</div>'+
      q.ans.map((a,i) => '<button class="ans-btn" id="ans'+i+'" onclick="pickMain('+i+')">'+escHtml(a.t)+'</button>').join('')+
    '</div>';
}

function rScale() {
  var q = SCALE_QS[S.qi];
  var n = 13 + S.qi;
  var sel = S.scaleAns[q.id]||0;
  return '<div class="brand">du<span>Ring</span>It — Monie ID</div>'+
    prog(n, 16, 'Question '+n+' of 16')+
    '<div class="card" style="margin-top:16px;">'+
      '<div class="q-label">'+q.id+'</div>'+
      '<div class="q-text">'+escHtml(q.text)+'</div>'+
      '<div class="scale-poles"><span>'+escHtml(q.lo)+'</span><span>'+escHtml(q.hi)+'</span></div>'+
      '<div class="dots-row">'+
        [1,2,3,4,5].map(d => '<div class="dot'+(sel===d?' chosen':'')+'" onclick="pickScale(\''+q.id+'\','+d+')"></div>').join('')+
      '</div>'+
    '</div>'+
    '<button class="btn-primary" onclick="nextScale()" '+(sel===0?'disabled':'')+'>'+
      (S.qi < 3 ? 'Next →' : 'See My Result →')+
    '</button>';
}

function rTB() {
  var q = S.tbQs[S.qi];
  return '<div class="brand">du<span>Ring</span>It — Monie ID</div>'+
    prog(S.qi+1, 3, 'One more thing — tie-breaker '+(S.qi+1)+' of 3')+
    '<div class="card" style="margin-top:16px;">'+
      '<div class="q-label tb">Tie-breaker</div>'+
      '<div class="q-text">'+escHtml(q.text)+'</div>'+
      '<button class="ans-btn" onclick="pickTB(\''+q.a.c+'\')">'+escHtml(q.a.t)+'</button>'+
      '<button class="ans-btn" onclick="pickTB(\''+q.b.c+'\')">'+escHtml(q.b.t)+'</button>'+
    '</div>';
}

function rResult() {
  if (S.result === "BRIDGE") return rBridge();
  var code = S.result;
  var a = ARC[code];
  var sorted = Object.entries(S.scores).sort((x,y)=>y[1]-x[1]);
  var maxS = sorted[0][1];
  return '<div class="brand">du<span>Ring</span>It — Monie ID</div>'+
    '<div class="card">'+
      '<div class="result-family">'+escHtml(a.fam)+'</div>'+
      '<div class="result-name">'+escHtml(a.name)+'</div>'+
      '<div class="result-monieid">Your Monie ID</div>'+
      '<div class="sec-label">Identity</div><div class="sec-body">'+escHtml(a.identity)+'</div>'+
      '<div class="sec-label">Shadow</div><div class="sec-body" style="margin-bottom:0">'+escHtml(a.shadow)+'</div>'+
      (S.flags.length ? S.flags.map(f=>'<div class="flag">⚑ '+escHtml(f)+'</div>').join('') : '')+
    '</div>'+
    '<div class="card"><div class="sec-label" style="margin-bottom:14px">All 11 scores</div>'+
      '<div class="scores-section">'+
        sorted.map(function(e){
          var c=e[0],v=e[1];
          var pct = maxS > 0 ? Math.round(v/maxS*100) : 0;
          return '<div class="score-row">'+
            '<div class="score-name'+(c===code?' top':'')+'">'+escHtml(ARC[c].name)+'</div>'+
            '<div class="score-bg"><div class="score-bar'+(c===code?'':' dim')+'" style="width:'+pct+'%"></div></div>'+
            '<div class="score-val">'+v.toFixed(1)+'</div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<button class="btn-primary" onclick="goVal()">Continue to Feedback →</button>';
}

function rBridge() {
  var a = S.bridge[0], b = S.bridge[1];
  var sorted = Object.entries(S.scores).sort((x,y)=>y[1]-x[1]);
  var maxS = sorted[0][1];
  var bridgeCopy = "You sit between two financial identities — "+ARC[a].name+" and "+ARC[b].name+
    ". That's not a contradiction. It means your relationship with money operates on two tracks simultaneously: "+
    FAM_CHARS[ARC[a].fam]+" and "+FAM_CHARS[ARC[b].fam]+". Most people are one. You're the rare case that's both.";
  return '<div class="brand">du<span>Ring</span>It — Monie ID</div>'+
    '<div class="card">'+
      '<div class="result-family">Bridge Identity</div>'+
      '<div class="result-name">'+escHtml(ARC[a].name)+' × '+escHtml(ARC[b].name)+'</div>'+
      '<div class="result-monieid">Your Monie ID</div>'+
      '<div class="sec-body">'+escHtml(bridgeCopy)+'</div>'+
      '<div class="bridge-pair">'+
        '<div class="bridge-half">'+
          '<div class="bridge-half-name">'+escHtml(ARC[a].name)+'</div>'+
          '<div class="bridge-half-fam">'+escHtml(ARC[a].fam)+'</div>'+
          '<div class="bridge-half-body">'+escHtml(ARC[a].identity)+'</div>'+
        '</div>'+
        '<div class="bridge-half">'+
          '<div class="bridge-half-name">'+escHtml(ARC[b].name)+'</div>'+
          '<div class="bridge-half-fam">'+escHtml(ARC[b].fam)+'</div>'+
          '<div class="bridge-half-body">'+escHtml(ARC[b].identity)+'</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="card"><div class="sec-label" style="margin-bottom:14px">All 11 scores</div>'+
      '<div class="scores-section">'+
        sorted.map(function(e){
          var c=e[0],v=e[1];
          var pct = maxS > 0 ? Math.round(v/maxS*100) : 0;
          var isTop = (c===a||c===b);
          return '<div class="score-row">'+
            '<div class="score-name'+(isTop?' top':'')+'">'+escHtml(ARC[c].name)+'</div>'+
            '<div class="score-bg"><div class="score-bar'+(isTop?'':' dim')+'" style="width:'+pct+'%"></div></div>'+
            '<div class="score-val">'+v.toFixed(1)+'</div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<button class="btn-primary" onclick="goVal()">Continue to Feedback →</button>';
}

function rValidate() {
  var v = S.val;
  var resOpts = ["Yes, that's me","Mostly yes","Somewhat","Not really","No, wrong"];
  var canSub = (v.res !== undefined) && v.pick && v.rating;
  return '<div class="brand">du<span>Ring</span>It — Pilot Validation</div>'+
    '<div class="card">'+
      '<div class="q-label">For the team</div>'+
      '<div class="val-q">Does your result feel accurate?</div>'+
      '<div class="val-opts">'+
        resOpts.map(function(opt,i){
          return '<button class="val-btn'+(v.res===i?' chosen':'')+'" onclick="setV(\'res\','+i+')">'+escHtml(opt)+'</button>';
        }).join('')+
      '</div>'+
      '<div class="val-q">Which archetype actually feels most accurate to you?</div>'+
      '<div class="val-opts">'+
        Object.keys(ARC).map(function(code){
          return '<button class="val-btn'+(v.pick===code?' chosen':'')+'" onclick="setV(\'pick\',\''+code+'\')">'+
            escHtml(ARC[code].name)+'<span style="color:#555;font-size:12px"> — '+escHtml(ARC[code].fam)+'</span>'+
          '</button>';
        }).join('')+
      '</div>'+
      '<div class="val-q">How accurately does this describe your real money behavior? (1–5)</div>'+
      '<div class="stars" style="margin-bottom:24px">'+
        [1,2,3,4,5].map(n=>'<span class="star'+(( v.rating||0)>=n?' on':'')+'" onclick="setV(\'rating\','+n+')">★</span>').join('')+
      '</div>'+
      '<div class="val-q">Anything to add? (optional)</div>'+
      '<textarea placeholder="What felt off? What resonated?" oninput="setV(\'note\',this.value)">'+escHtml(v.note||'')+'</textarea>'+
    '</div>'+
    '<button class="btn-primary" onclick="submitVal()" '+(canSub?'':'disabled')+'>Export My Data →</button>'+
    (v.exported ? renderExport() : '')+
    '<button class="btn-restart" onclick="restart()">↺ Start over</button>';
}

function renderExport() {
  var data = buildExport();
  var json = JSON.stringify(data, null, 2);
  return '<div class="card" style="margin-top:16px">'+
    '<div class="sec-label" style="margin-bottom:8px">Pilot data (copy and send to team)</div>'+
    '<div class="export-box" id="expBox">'+escHtml(json)+'</div>'+
    '<button class="btn-copy" onclick="doCopy()">📋 Copy to clipboard</button>'+
    '<div style="font-size:12px;color:#444;text-align:center;margin-top:10px">Thank you for helping validate duRingIt 🙏</div>'+
  '</div>';
}

function buildExport() {
  var sorted = Object.entries(S.scores).sort((x,y)=>y[1]-x[1]);
  var resLabel = S.result === "BRIDGE"
    ? "Bridge: "+S.bridge.map(c=>ARC[c].name).join(" × ")
    : ARC[S.result].name;
  var resOpts = ["Yes, that's me","Mostly yes","Somewhat","Not really","No, wrong"];
  return {
    timestamp: new Date().toISOString(),
    pilot: "v1.0",
    name: S.name || "anonymous",
    scores: Object.fromEntries(sorted.map(function(e){ return [ARC[e[0]].name, +e[1].toFixed(1)]; })),
    result: resLabel,
    tiebreaker_triggered: S.tbPair !== null,
    tiebreaker_answers: S.tbAns.map(c=>ARC[c].name),
    contradiction_flags: S.flags,
    validation: {
      resonates: S.val.res !== undefined ? resOpts[S.val.res] : null,
      most_accurate: S.val.pick ? ARC[S.val.pick].name : null,
      accuracy_rating: S.val.rating || null,
      notes: S.val.note || null
    }
  };
}

// ─────────────────────────────────────────────
// HANDLERS
// ─────────────────────────────────────────────

function startQuiz() {
  var el = document.getElementById("nameIn");
  S.name = el ? el.value.trim() : "";
  S.screen = "main";
  S.qi = 0;
  render();
  scrollTo(0,0);
}

function pickMain(idx) {
  var q = MAIN_QS[S.qi];
  var primary = q.ans[idx].p;
  // Flash selected
  var btns = document.querySelectorAll(".ans-btn");
  if (btns[idx]) btns[idx].classList.add("chosen");
  scoreChoice(primary);
  setTimeout(function(){
    S.qi++;
    if (S.qi >= MAIN_QS.length) { S.screen = "scale"; S.qi = 0; }
    render(); scrollTo(0,0);
  }, 200);
}

function pickScale(qid, dot) {
  S.scaleAns[qid] = dot;
  render();
}

function nextScale() {
  S.qi++;
  if (S.qi >= SCALE_QS.length) {
    // All 16 done — compute
    var tb = checkTB();
    if (!tb) {
      var winner = topTwo()[0][0];
      calcFlags(winner);
      S.result = winner;
      S.screen = "result";
    } else if (tb.bridge) {
      S.result = "BRIDGE";
      S.bridge = tb.pair;
      S.screen = "result";
    } else {
      S.tbPair = tb.pair;
      S.tbQs = tb.qs;
      S.qi = 0;
      S.screen = "tb";
    }
  }
  render(); scrollTo(0,0);
}

function pickTB(code) {
  S.tbAns.push(code);
  var btns = document.querySelectorAll(".ans-btn");
  btns.forEach(function(b){ if (b.textContent.trim() === (code === S.tbQs[S.qi].a.c ? S.tbQs[S.qi].a.t : S.tbQs[S.qi].b.t)) b.classList.add("chosen"); });
  setTimeout(function(){
    S.qi++;
    if (S.qi >= 3) { resolveTBResult(); S.screen = "result"; }
    render(); scrollTo(0,0);
  }, 200);
}

function goVal() { S.screen = "validate"; render(); scrollTo(0,0); }

function setV(key, val) {
  S.val[key] = val;
  render();
}

function submitVal() {
  S.val.exported = true;
  render();
  setTimeout(doCopy, 300);
}

function doCopy() {
  var text = JSON.stringify(buildExport(), null, 2);
  var btn = document.querySelector(".btn-copy");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      if (btn) { btn.textContent = "✓ Copied!"; setTimeout(function(){ if(btn) btn.textContent = "📋 Copy to clipboard"; }, 2000); }
    });
  } else {
    var el = document.createElement("textarea");
    el.value = text; document.body.appendChild(el); el.select(); document.execCommand("copy"); document.body.removeChild(el);
    if (btn) { btn.textContent = "✓ Copied!"; setTimeout(function(){ if(btn) btn.textContent = "📋 Copy to clipboard"; }, 2000); }
  }
}

function restart() {
  resetState();
  render(); scrollTo(0,0);
}

function escHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// Boot
render();
</script>
</body>
</html>
